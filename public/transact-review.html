<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>TRAN$ACT screen review</title>
<style>*{box-sizing:border-box}body{margin:0;background:#161b17;color:#f3f5f3;font:14px system-ui}header{height:68px;display:flex;align-items:center;gap:16px;padding:12px;position:sticky;left:0;top:0;z-index:1;background:#161b17;border-bottom:1px solid #566248;width:100vw}select,a{min-height:44px;padding:10px;background:#101710;color:#ffcf31;border:1px solid #756125}iframe{display:block;border:0;width:1366px;height:768px;background:#080b09}</style>
<header><strong>TRAN$ACT screen review</strong><label>Viewport <select id="size"><option>1366 × 768</option><option>1440 × 900</option><option>1024 × 768</option><option>768 × 1024</option><option>5120 × 2160</option><option value="683 × 384">1366 × 768 at 200% scale</option></select></label><a href="/transact">Open full workspace</a></header><iframe title="TRAN$ACT review" src="/transact"></iframe>
<script>document.querySelector('#size').addEventListener('change',event=>{const [width,height]=event.target.value.split(' × ');const frame=document.querySelector('iframe');frame.style.width=width+'px';frame.style.height=height+'px';frame.style.zoom=event.target.value==='683 × 384'?'2':'1'});</script></html>
