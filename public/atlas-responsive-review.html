<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Atlas responsive review</title>
<style>body{margin:0;background:#303630;color:white;font:16px system-ui}header{padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{padding:12px;font:inherit}iframe{display:block;width:375px;height:850px;border:2px solid #d0ec72;margin:0 auto;background:#111}output{margin-left:15px}</style>
<header><strong>Preview QA</strong><button data-width="320">320 px</button><button data-width="375">375 px</button><button data-width="430">430 px</button><button data-width="1024">1024 px</button><label>Lesson <select id="lesson"><option value="family=private">Private</option><option value="family=auction">Auction</option><option value="family=reference">URL reference</option><option value="assembly=machine">Marketplace</option><option value="topic=overview">Guides</option><option value="assembly=chassis">Chassis</option></select></label><output id="width">375 px</output></header>
<iframe id="atlas" title="Atlas at selected width" src="/atlas?family=private"></iframe>
<script>const query=new URLSearchParams(location.search);const selectedWidth=query.get('width');if(['320','375','430','1024'].includes(selectedWidth)){document.getElementById('atlas').style.width=selectedWidth+'px';document.getElementById('width').value=selectedWidth+' px'}const selectedLesson=query.get('lesson');if([...document.getElementById('lesson').options].some(option=>option.value===selectedLesson)){document.getElementById('lesson').value=selectedLesson;document.getElementById('atlas').src='/atlas?'+selectedLesson}document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{document.getElementById('atlas').style.width=button.dataset.width+'px';document.getElementById('width').value=button.dataset.width+' px'}));document.getElementById('lesson').addEventListener('change',event=>document.getElementById('atlas').src='/atlas?'+event.target.value);</script></html>
