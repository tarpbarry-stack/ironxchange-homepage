name: IXI Mobile Immutable AOS Surface Certification

on:
  push:
    branches:
      - mobile/commercial-aos-v1-immutable-surface-scale

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install repository dependencies
        run: npm install --no-audit --no-fund

      - name: Run immutable AOS surface contract
        run: node --test tests/ixi-mobile-immutable-surface-contract.test.mjs

      - name: Build production application
        env:
          NEXT_PUBLIC_SHARETRIBE_CLIENT_ID: ci-placeholder
        run: npm run build
