name: Deploy IX-Core Payables

"on":
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Immutable IX-Core commit SHA
        required: true
        default: a9417a5d83fb1313052c03eed77d2157ee7d0948
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-ixi-core-payables.yml']

permissions:
  contents: read

concurrency:
  group: ixi-core-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
      IXI_CORE_SHA: ${{ inputs.commit_sha || 'a9417a5d83fb1313052c03eed77d2157ee7d0948' }}
    steps:
      - name: Validate immutable release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IXI_CORE_SHA" =~ ^[0-9a-f]{40}$ ]]
          resolved_sha="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/tarpbarry-stack/ixi-core/commits/$IXI_CORE_SHA" | jq -r '.sha')"
          test "$resolved_sha" = "$IXI_CORE_SHA"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy guarded Payables release
        shell: bash
        run: |
          set -euo pipefail
          remote_script="$(cat <<'REMOTE_SCRIPT'
          set -eu
          APP=/var/www/ix-core
          RELEASE_SHA=__IXI_CORE_SHA__
          STAGE=/tmp/ixi-core-payables-__IXI_CORE_SHA__
          ARCHIVE=/tmp/ixi-core-payables-__IXI_CORE_SHA__.tgz
          BACKUP=/var/backups/ixi-core-releases/payables-pre-__IXI_CORE_SHA__.tgz
          DEPS_BACKUP=/var/backups/ixi-core-releases/node_modules-pre-__IXI_CORE_SHA__
          CHANGED='package-lock.json financial/IXIFinancialCommandEngine.js financial/IXIFinancialCommandRoutes.js financial/IXIFinancialDocumentFactoryRegistry.js financial/IXIFinancialPermissionEngine.js financial/IXIFinancialRoutes.js financial/IXIFinancialValidationBridge.js'
          ADDED='financial/IXIFinancialPayablesControlFactory.js'
          SUCCESS=0
          DEPS_SWAPPED=0

          run_pm2() { if [ "$PM2_USER" = root ]; then pm2 "$@"; else sudo -u ubuntu -H pm2 "$@"; fi; }
          rollback() {
            if [ "$SUCCESS" -eq 0 ] && [ -f "$BACKUP" ]; then
              echo 'Deployment failed; restoring previous IX-Core source.' >&2
              cd "$APP"
              rm -f $ADDED
              tar -xzf "$BACKUP"
              if [ "$DEPS_SWAPPED" -eq 1 ] && [ -d "$DEPS_BACKUP" ]; then
                rm -rf "$APP/node_modules"
                mv "$DEPS_BACKUP" "$APP/node_modules"
              fi
              run_pm2 reload IX-Core --update-env || run_pm2 restart IX-Core --update-env || true
            fi
          }
          trap rollback EXIT

          test -d "$APP"
          if pm2 describe IX-Core >/dev/null 2>&1; then PM2_USER=root;
          elif sudo -u ubuntu -H pm2 describe IX-Core >/dev/null 2>&1; then PM2_USER=ubuntu;
          else echo 'PM2 process IX-Core was not found.' >&2; exit 1; fi

          cd "$APP"
          printf '%s  %s\n' \
            '9e3b6adcd0d2d447bdfd070d681fef6ed448e9f2d729a145fb6500c2e06aa120' 'package-lock.json' \
            'f4fbeea6270271e4518be2709b974beb43c583580df36ded7efb4d922de89057' 'financial/IXIFinancialCommandEngine.js' \
            '2115ff5736ecd8adaa3e0ec1f564ab446412dc32ec7481bbdc7873cac7007e46' 'financial/IXIFinancialCommandRoutes.js' \
            'e2c8c69cc42ded24c6463d09f50a7903556766eda00877e183cf34c1ef8b5fe3' 'financial/IXIFinancialDocumentFactoryRegistry.js' \
            '3bf786bb0da8a3d91706bd8aeefe613bd49ce2d35650657e414a3cd25a0247b8' 'financial/IXIFinancialPermissionEngine.js' \
            '42c15631fcb267a6859621ba76c257e1b6cb8abfc2c5fd7709443e9bd4266f18' 'financial/IXIFinancialRoutes.js' \
            '49db06658042f53f2103d66ae9f062d3407b140431aebbd23fce8d9aaef3bcc0' 'financial/IXIFinancialValidationBridge.js' | sha256sum -c -

          mkdir -p /var/backups/ixi-core-releases
          tar -czf "$BACKUP" $CHANGED
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          curl -fsSL "https://github.com/tarpbarry-stack/ixi-core/archive/$RELEASE_SHA.tar.gz" -o "$ARCHIVE"
          tar -xzf "$ARCHIVE" --strip-components=1 -C "$STAGE"

          cd "$STAGE"
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=low
          npm test
          for file in $CHANGED $ADDED; do node --check "$file"; done
          node - <<'NODE'
          const {createPayablesControlDocument}=require('./financial/IXIFinancialPayablesControlFactory');
          const {validateFinancialDocument}=require('./financial/IXIFinancialValidationBridge');
          const {IXI_FINANCIAL_ACTIONS,getEffectiveFinancialPermissions}=require('./financial/IXIFinancialPermissionEngine');
          const document=createPayablesControlDocument({financialDocumentId:'ifd_ap_deploy_probe',sourceFinancialDocumentId:'ifd_bill_deploy_probe',entityPassportId:'PASS-ENTITY-PROBE',actorPassportId:'PASS-ACTOR-PROBE',payablesControl:{payable:{billId:'ifd_bill_deploy_probe',billNumber:'DEPLOY-AP-1'}},references:[{passportId:'PASS-ENTITY-PROBE',role:'entity'}]});
          const validation=validateFinancialDocument(document);
          const permissions=getEffectiveFinancialPermissions({roles:['financial-accounting']});
          if(!validation.ok||document.accountingTreatment.economicEvent!==false||document.lines.length!==0||!permissions.includes(IXI_FINANCIAL_ACTIONS.RECORD_PAYMENT)||!permissions.includes(IXI_FINANCIAL_ACTIONS.APPLY_VENDOR_CREDIT)||!permissions.includes(IXI_FINANCIAL_ACTIONS.MANAGE_PAYABLES)) throw new Error(`Payables deploy probe failed: ${validation.errors.join(' ')}`);
          NODE

          cd "$APP"
          for file in $CHANGED $ADDED; do install -D -m 0644 "$STAGE/$file" "$APP/$file"; done
          test -d "$APP/node_modules"
          rm -rf "$DEPS_BACKUP"
          mv "$APP/node_modules" "$DEPS_BACKUP"
          DEPS_SWAPPED=1
          cp -a "$STAGE/node_modules" "$APP/node_modules"
          run_pm2 reload IX-Core --update-env
          attempt=0
          until curl -fsS http://127.0.0.1:4100/health >/dev/null; do attempt=$((attempt + 1)); [ "$attempt" -lt 15 ] || exit 1; sleep 2; done
          route_status="$(curl -sS -o "$STAGE/payables-route.json" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"documentType":"payables-control","input":{"sourceFinancialDocumentId":"ifd_bill_deploy_probe"}}' http://127.0.0.1:4100/financial/commands/create)"
          case "$route_status" in 401|403) ;; *) cat "$STAGE/payables-route.json" >&2; exit 1 ;; esac

          SUCCESS=1
          trap - EXIT
          rm -rf "$DEPS_BACKUP"
          rm -rf "$STAGE" "$ARCHIVE"
          printf 'IX-Core Payables %s deployed; health=200; protected-route=%s\n' "$RELEASE_SHA" "$route_status"
          REMOTE_SCRIPT
          )"
          remote_script="${remote_script//__IXI_CORE_SHA__/$IXI_CORE_SHA}"
          parameters="$(jq -cn --arg command "$remote_script" '{commands:[$command]}')"
          command_id="$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$AWS_INSTANCE_ID" --document-name AWS-RunShellScript --comment "Deploy IX-Core Payables $IXI_CORE_SHA" --parameters "$parameters" --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --region "$AWS_REGION" --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID" || true
          invocation="$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID")"
          printf '%s' "$invocation" | jq -r '.StandardOutputContent'
          printf '%s' "$invocation" | jq -r '.StandardErrorContent' >&2
          test "$(printf '%s' "$invocation" | jq -r '.Status')" = Success

      - name: Record Payables release
        shell: bash
        run: |
          {
            echo '## IX-Core Payables release'
            echo "- Commit: \`$IXI_CORE_SHA\`"
            echo '- Financial tests and Payables probe: passed'
            echo '- Health and protected route: passed'
          } >> "$GITHUB_STEP_SUMMARY"
