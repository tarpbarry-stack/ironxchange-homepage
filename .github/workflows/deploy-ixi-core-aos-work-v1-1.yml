name: Audit IX-Core Equipment identity aliases

on:
  push:
    branches:
      - release/aos-work-production-20260909
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run immutable identity census
        id: audit
        shell: bash
        run: |
          set -euo pipefail

          remote_script="$(cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd /var/www/ix-core

          IXI_MOS_STORAGE_PROVIDER=sqlite \
          IXI_MOS_SQLITE_PATH=/var/lib/ixi-core/mos/ixi-aos.sqlite \
          IXI_MOS_DATA_ROOT=/var/lib/ixi-core/mos \
          IXI_PASSPORT_DATA_FILE=/var/www/ix-core/passport/passports.json \
          NODE_PATH=/var/www/ix-core/node_modules \
          node - <<'NODE'
          const assert = require("node:assert/strict");
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const Database = require("better-sqlite3");
          const { MOS_PATHS } = require("./mos/storage/mosPaths");
          const { readJsonFile } = require("./mos/storage/jsonStore");
          const { resolveCanonicalObjectIdentity } = require("./mos/identity/canonicalObjectAdmissionService");
          const { buildRailProjectionMap } = require("./mos/accounts/aosEnvironmentService");

          const entityId = "entity_4d78e9fb-92e4-4cc2-a8cb-1a2f19e097d0";
          const databasePath = process.env.IXI_MOS_SQLITE_PATH;
          const passportPath = process.env.IXI_PASSPORT_DATA_FILE;
          const db = new Database(databasePath, { readonly: true });
          const state = () => ({
            rows: db.prepare(`
              SELECT collection_key, version, payload_sha256
              FROM mos_collections
              WHERE collection_key IN ('objects.json','relationships.json','workspace-sessions.json')
              ORDER BY collection_key
            `).all(),
            passportSha256: crypto.createHash("sha256")
              .update(fs.readFileSync(passportPath)).digest("hex")
          });
          const before = state();
          const objects = Object.values(readJsonFile(MOS_PATHS.objects, {}))
            .filter(object => object.entityId === entityId && object.status === "active");
          const relationships = Object.values(readJsonFile(MOS_PATHS.relationships, {}))
            .filter(item => item.entityId === entityId && item.status === "active");
          const rows = objects.map(object => {
            const identity = resolveCanonicalObjectIdentity({ entityId, objectId: object.objectId });
            const listingAliases = (identity.aliases || [])
              .filter(alias => alias.sourceType === "sharetribe-listing")
              .map(alias => alias.sourceId);
            return {
              objectId: object.objectId,
              objectType: object.objectType,
              displayName: object.displayName,
              passportId: identity.passportId,
              listingAliases
            };
          });
          const machines = rows.filter(row => row.objectType === "machine");
          const machineListingAliases = machines.flatMap(row => row.listingAliases);
          const duplicateAliasObjects = machines.filter(row => row.listingAliases.length > 1);
          const nonMachineListingAliases = rows.filter(row =>
            row.objectType !== "machine" && row.listingAliases.length
          );
          const equipment = objects.filter(object =>
            object.objectType === "system-index" &&
            object.metadata?.adapterId === "ixi-owned-equipment" &&
            object.metadata?.systemIndexPresentation === true
          );
          assert.equal(equipment.length, 1);
          const projection = buildRailProjectionMap(relationships, objects);
          const after = state();
          assert.deepEqual(after, before, "Read-only identity census mutated canonical state");
          assert.deepEqual(db.pragma("integrity_check"), [{ integrity_check: "ok" }]);
          db.close();

          console.log(JSON.stringify({
            ok: true,
            entityId,
            activeObjectCount: rows.length,
            activeMachineObjectCount: machines.length,
            machineListingAliasCount: machineListingAliases.length,
            distinctMachineListingAliasCount: new Set(machineListingAliases).size,
            duplicateAliasObjects,
            nonMachineListingAliases,
            machines,
            equipmentObjectId: equipment[0].objectId,
            equipmentProjectionCount: projection[equipment[0].objectId]?.members?.length || 0,
            immutable: true
          }, null, 2));
          NODE

          curl -fsS http://127.0.0.1:4100/health
          REMOTE_SCRIPT
          )"

          remote_script_b64="$(printf '%s' "$remote_script" | base64 -w 0)"
          ssm_command="printf '%s' '$remote_script_b64' | base64 -d | bash"
          parameters="$(jq -cn --arg command "$ssm_command" '{commands:[$command]}')"
          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$AWS_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment 'Read-only IX-Core Equipment identity alias census' \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

          if ! aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$AWS_INSTANCE_ID"; then
            true
          fi

          invocation="$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$AWS_INSTANCE_ID")"
          printf '%s' "$invocation" | jq -r '.StandardOutputContent'
          printf '%s' "$invocation" | jq -r '.StandardErrorContent' >&2
          test "$(printf '%s' "$invocation" | jq -r '.Status')" = Success
