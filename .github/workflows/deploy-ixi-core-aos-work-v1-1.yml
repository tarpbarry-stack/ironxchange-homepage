name: Deploy IX-Core active lineage resolver

on:
  push:
    branches:
      - release/aos-work-production-20260909
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ixi-core-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      IXI_CORE_SHA: 5a5c019787cd5e7e84faf26c85755c503671474b

    steps:
      - name: Validate immutable release
        shell: bash
        run: |
          set -euo pipefail
          resolved_sha="$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/tarpbarry-stack/ixi-core/commits/$IXI_CORE_SHA" \
            | jq -r '.sha')"
          test "$resolved_sha" = "$IXI_CORE_SHA"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy resolver and verify live identity
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          remote_script="$(cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          APP=/var/www/ix-core
          RELEASE_SHA=5a5c019787cd5e7e84faf26c85755c503671474b
          LIVE_SHA=c7c55345ffd8e8ea4b90ff6a97433a7083f7efbb
          ENTITY_ID=entity_4d78e9fb-92e4-4cc2-a8cb-1a2f19e097d0
          FILE=mos/identity/canonicalObjectAdmissionService.js
          STAGE=/tmp/ixi-core-active-lineage-$RELEASE_SHA
          BACKUP_ROOT=/var/backups/ixi-core-aos-work
          BACKUP=$BACKUP_ROOT/pre-lineage-$RELEASE_SHA-$(date -u +%Y%m%dT%H%M%SZ)
          DATABASE=/var/lib/ixi-core/mos/ixi-aos.sqlite
          PASSPORTS=/var/www/ix-core/passport/passports.json
          SUCCESS=0

          run_pm2() {
            if [ "$PM2_USER" = root ]; then pm2 "$@"; else sudo -u ubuntu -H pm2 "$@"; fi
          }

          rollback() {
            if [ "$SUCCESS" -eq 1 ]; then return; fi
            echo 'Resolver deployment failed; restoring prior verified source.' >&2
            if [ -n "${PM2_USER:-}" ]; then run_pm2 stop IX-Core >/dev/null 2>&1 || true; fi
            if [ -f "$BACKUP/source.js" ]; then cp -a "$BACKUP/source.js" "$APP/$FILE"; fi
            if [ -n "${PM2_USER:-}" ]; then run_pm2 restart IX-Core --update-env >/dev/null 2>&1 || true; fi
          }
          trap rollback EXIT

          test -f "$APP/$FILE"
          test -f "$DATABASE"
          test -f "$PASSPORTS"
          if pm2 describe IX-Core >/dev/null 2>&1; then
            PM2_USER=root
          elif sudo -u ubuntu -H pm2 describe IX-Core >/dev/null 2>&1; then
            PM2_USER=ubuntu
          else
            echo 'PM2 process IX-Core was not found.' >&2
            exit 1
          fi

          mkdir -p "$BACKUP"
          curl -fsS http://127.0.0.1:4100/health > "$BACKUP/preflight-health.json"
          rm -rf -- "$STAGE"
          git clone --quiet https://github.com/tarpbarry-stack/ixi-core.git "$STAGE"
          git -C "$STAGE" checkout --quiet --detach "$RELEASE_SHA"
          test "$(git -C "$STAGE" rev-parse HEAD)" = "$RELEASE_SHA"

          cd "$STAGE"
          npm ci
          IXI_MOS_INTERNAL_AUTH_ENFORCE=true npm test
          node --check "$FILE"
          test "$(sha256sum "$APP/$FILE" | cut -d' ' -f1)" = \
            "$(git show "$LIVE_SHA:$FILE" | sha256sum | cut -d' ' -f1)"

          cp -a "$APP/$FILE" "$BACKUP/source.js"
          install -D -m 0644 "$STAGE/$FILE" "$APP/$FILE"
          test "$(sha256sum "$APP/$FILE" | cut -d' ' -f1)" = \
            "$(sha256sum "$STAGE/$FILE" | cut -d' ' -f1)"

          run_pm2 restart IX-Core --update-env
          attempt=0
          until curl -fsS http://127.0.0.1:4100/health > "$BACKUP/health.json"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 20 ]; then exit 1; fi
            sleep 2
          done

          cd "$APP"
          IXI_MOS_STORAGE_PROVIDER=sqlite \
          IXI_MOS_SQLITE_PATH="$DATABASE" \
          IXI_MOS_DATA_ROOT=/var/lib/ixi-core/mos \
          IXI_PASSPORT_DATA_FILE="$PASSPORTS" \
          NODE_PATH="$APP/node_modules" \
          ENTITY_ID="$ENTITY_ID" \
          node - <<'NODE'
          const assert = require("node:assert/strict");
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const Database = require("better-sqlite3");
          const { MOS_PATHS } = require("./mos/storage/mosPaths");
          const { readJsonFile } = require("./mos/storage/jsonStore");
          const { resolveCanonicalObjectIdentity } = require("./mos/identity/canonicalObjectAdmissionService");
          const { buildRailProjectionMap } = require("./mos/accounts/aosEnvironmentService");

          const entityId = process.env.ENTITY_ID;
          const db = new Database(process.env.IXI_MOS_SQLITE_PATH, { readonly: true });
          const state = () => ({
            rows: db.prepare("SELECT collection_key, version, payload_sha256 FROM mos_collections ORDER BY collection_key").all(),
            passportSha256: crypto.createHash("sha256").update(fs.readFileSync(process.env.IXI_PASSPORT_DATA_FILE)).digest("hex")
          });
          const before = state();
          assert.deepEqual(db.pragma("integrity_check"), [{ integrity_check: "ok" }]);

          const objects = Object.values(readJsonFile(MOS_PATHS.objects, {}))
            .filter(object => object.entityId === entityId && object.status === "active");
          const relationships = Object.values(readJsonFile(MOS_PATHS.relationships, {}))
            .filter(item => item.entityId === entityId && item.status === "active");
          const machines = objects.filter(object => object.objectType === "machine");
          assert.equal(machines.length, 23);
          const equipment = objects.filter(object =>
            object.objectType === "system-index" &&
            object.metadata?.adapterId === "ixi-owned-equipment" &&
            object.metadata?.systemIndexPresentation === true
          );
          assert.equal(equipment.length, 1);
          const members = buildRailProjectionMap(relationships, objects)[equipment[0].objectId]?.members || [];
          assert.equal(members.length, 23);
          assert.deepEqual(new Set(members.map(member => member.objectId)), new Set(machines.map(machine => machine.objectId)));

          const ripper = resolveCanonicalObjectIdentity({
            entityId,
            passportId: "IXIK7C87AQ",
            aliases: [{ sourceType: "sharetribe-listing", sourceId: "6a763a34-1657-4b3c-822d-9ac6763e7411" }]
          });
          assert.equal(ripper.object.status, "active");
          assert.equal(ripper.object.objectType, "machine");
          assert.equal(ripper.object.fields?.serialNumber, "872GP772GP01");
          assert.equal(ripper.object.fields?.stockNumber, "MGRPPER01");
          machines.forEach(machine => assert.equal(resolveCanonicalObjectIdentity({
            entityId,
            objectId: machine.objectId
          }).objectId, machine.objectId));

          assert.deepEqual(state(), before, "Read-only acceptance mutated canonical state");
          db.close();
          console.log(JSON.stringify({
            ok: true,
            activeMachineCount: machines.length,
            equipmentProjectionCount: members.length,
            ripperObjectId: ripper.objectId,
            ripperPassportId: ripper.passportId,
            allMachineIdentitiesCanonical: true,
            immutableAcceptance: true
          }, null, 2));
          NODE

          HEALTH="$BACKUP/health.json" node - <<'NODE'
          const assert = require("node:assert/strict");
          const health = require(process.env.HEALTH);
          assert.equal(health.ok, true);
          assert.equal(health.service, "ix-core");
          assert.equal(health.mosStorage?.provider, "sqlite");
          assert.equal(health.mosStorage?.integrity, "ok");
          NODE

          auth_status="$(curl -sS -o "$BACKUP/strict-auth.json" -w '%{http_code}' http://127.0.0.1:4100/mos/v1/aos/environment)"
          case "$auth_status" in 401|403) ;; *) exit 1 ;; esac

          SUCCESS=1
          trap - EXIT
          rm -rf -- "$STAGE"
          printf 'IX-Core active-lineage resolver %s deployed; machines=23; projection=23; health=200; strict-auth=%s; backup=%s\n' \
            "$RELEASE_SHA" "$auth_status" "$BACKUP"
          REMOTE_SCRIPT
          )"

          remote_script_b64="$(printf '%s' "$remote_script" | base64 -w 0)"
          ssm_command="printf '%s' '$remote_script_b64' | base64 -d | bash"
          parameters="$(jq -cn --arg command "$ssm_command" '{commands:[$command]}')"
          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$AWS_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy IX-Core active lineage resolver $IXI_CORE_SHA" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

          if ! aws ssm wait command-executed --region "$AWS_REGION" --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID"; then true; fi
          invocation="$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID")"
          printf '%s' "$invocation" | jq -r '.StandardOutputContent'
          printf '%s' "$invocation" | jq -r '.StandardErrorContent' >&2
          test "$(printf '%s' "$invocation" | jq -r '.Status')" = Success

      - name: Record deployment evidence
        if: always()
        shell: bash
        run: |
          set -u
          command_id="${{ steps.deploy.outputs.command_id }}"
          echo '## IX-Core active lineage resolver' >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $IXI_CORE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- SSM command: ${command_id:-not-created}" >> "$GITHUB_STEP_SUMMARY"
