name: Audit unbound Ripper Passport

on:
  push:
    branches:
      - release/aos-work-production-20260909
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Audit immutable Passport binding
        shell: bash
        run: |
          set -euo pipefail

          remote_script="$(cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd /var/www/ix-core

          IXI_MOS_STORAGE_PROVIDER=sqlite \
          IXI_MOS_SQLITE_PATH=/var/lib/ixi-core/mos/ixi-aos.sqlite \
          IXI_MOS_DATA_ROOT=/var/lib/ixi-core/mos \
          IXI_PASSPORT_DATA_FILE=/var/www/ix-core/passport/passports.json \
          NODE_PATH=/var/www/ix-core/node_modules \
          node - <<'NODE'
          const assert = require("node:assert/strict");
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const Database = require("better-sqlite3");
          const { MOS_PATHS } = require("./mos/storage/mosPaths");
          const { readJsonFile } = require("./mos/storage/jsonStore");
          const { readPassportRecords, passportSources } = require("./passport/passportRegistry");

          const entityId = "entity_4d78e9fb-92e4-4cc2-a8cb-1a2f19e097d0";
          const passportId = "IXIK7C87AQ";
          const listingId = "6a763a34-1657-4b3c-822d-9ac6763e7411";
          const db = new Database(process.env.IXI_MOS_SQLITE_PATH, { readonly: true });
          const before = {
            collections: db.prepare("SELECT collection_key, version, payload_sha256 FROM mos_collections ORDER BY collection_key").all(),
            passportSha256: crypto.createHash("sha256").update(fs.readFileSync(process.env.IXI_PASSPORT_DATA_FILE)).digest("hex")
          };

          const passports = readPassportRecords().filter(item => item.passportId === passportId);
          assert.equal(passports.length, 1, "Expected exactly one issued Passport");
          const passport = passports[0];
          assert.equal(passport.entityId, entityId, "Passport Entity mismatch");
          const sources = passportSources(passport);
          assert.equal(sources.filter(source => source.sourceType === "sharetribe-listing" && source.sourceId === listingId).length, 1, "Expected exact Sharetribe listing source");

          const objects = Object.values(readJsonFile(MOS_PATHS.objects, {}));
          const activeOwners = objects.filter(object =>
            object.status === "active" &&
            object.entityId === entityId &&
            (object.identities || []).some(identity =>
              identity?.passportId === passportId ||
              (identity?.sourceType === "sharetribe-listing" && identity?.sourceId === listingId)
            )
          );
          assert.equal(activeOwners.length, 0, "Passport/listing is already bound to an active Object");

          const after = {
            collections: db.prepare("SELECT collection_key, version, payload_sha256 FROM mos_collections ORDER BY collection_key").all(),
            passportSha256: crypto.createHash("sha256").update(fs.readFileSync(process.env.IXI_PASSPORT_DATA_FILE)).digest("hex")
          };
          assert.deepEqual(after, before, "Read-only Passport audit mutated canonical state");
          assert.deepEqual(db.pragma("integrity_check"), [{ integrity_check: "ok" }]);
          db.close();

          console.log(JSON.stringify({
            ok: true,
            passportId,
            entityId: passport.entityId,
            exactListingSource: true,
            sourceTypes: sources.map(source => source.sourceType).sort(),
            activeObjectBindings: activeOwners.length,
            immutable: true
          }, null, 2));
          NODE

          curl -fsS http://127.0.0.1:4100/health
          REMOTE_SCRIPT
          )"

          remote_script_b64="$(printf '%s' "$remote_script" | base64 -w 0)"
          ssm_command="printf '%s' '$remote_script_b64' | base64 -d | bash"
          parameters="$(jq -cn --arg command "$ssm_command" '{commands:[$command]}')"
          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$AWS_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment 'Read-only audit of unbound Ripper Passport' \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"

          if ! aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$AWS_INSTANCE_ID"; then
            true
          fi

          invocation="$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$AWS_INSTANCE_ID")"
          printf '%s' "$invocation" | jq -r '.StandardOutputContent'
          printf '%s' "$invocation" | jq -r '.StandardErrorContent' >&2
          test "$(printf '%s' "$invocation" | jq -r '.Status')" = Success
