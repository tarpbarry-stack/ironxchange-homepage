name: IXI Mobile Console Invariant Certification

on:
  push:
    branches:
      - mobile/commercial-aos-v1-console-invariant

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install repository dependencies
        run: npm install --no-audit --no-fund
      - name: Run Console invariant contract
        run: node --test tests/ixi-mobile-console-invariant-contract.test.mjs
      - name: Build production application
        env:
          NEXT_PUBLIC_SHARETRIBE_CLIENT_ID: ci-mobile-console-invariant-placeholder
        run: npm run build
