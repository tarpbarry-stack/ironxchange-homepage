name: IXI Mobile Authenticated Dollar Certification

on:
  push:
    branches:
      - mobile/commercial-aos-v1-dollar-authenticated-v4

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install repository dependencies
        run: npm install --no-audit --no-fund

      - name: Run authenticated dollar contract
        run: node --test tests/ixi-mobile-authenticated-dollar-contract.test.mjs

      - name: Build production application
        env:
          NEXT_PUBLIC_SHARETRIBE_CLIENT_ID: ci-mobile-authenticated-dollar
        run: npm run build
