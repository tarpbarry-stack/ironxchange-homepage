name: Deploy IX-Core Financial Controls

"on":
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Immutable IX-Core commit SHA
        required: true
        default: 6033aa4581650780e9f074f799d42b8ef870ed37
  push:
    branches: [main]
    paths: [".github/workflows/deploy-ixi-core-general-ledger.yml"]

permissions:
  contents: read

concurrency:
  group: ixi-core-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
      IXI_CORE_SHA: ${{ inputs.commit_sha || '6033aa4581650780e9f074f799d42b8ef870ed37' }}
    steps:
      - name: Validate immutable release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IXI_CORE_SHA" =~ ^[0-9a-f]{40}$ ]]
          resolved_sha="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/tarpbarry-stack/ixi-core/commits/$IXI_CORE_SHA" | jq -r '.sha')"
          test "$resolved_sha" = "$IXI_CORE_SHA"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy guarded General Ledger release
        shell: bash
        run: |
          set -euo pipefail
          remote_script="$(cat <<'REMOTE_SCRIPT'
          set -eu
          APP=/var/www/ix-core
          RELEASE_SHA=__IXI_CORE_SHA__
          STAGE=/tmp/ixi-core-general-ledger-__IXI_CORE_SHA__
          ARCHIVE=/tmp/ixi-core-general-ledger-__IXI_CORE_SHA__.tgz
          BACKUP=/var/backups/ixi-core-releases/general-ledger-pre-__IXI_CORE_SHA__.tgz
          CHANGED='financial/IXIFinancialCloseControlEngine.js financial/IXIFinancialCommandEngine.js financial/IXIFinancialCommandRoutes.js financial/IXIFinancialDocumentFactoryRegistry.js financial/IXIFinancialOperationalControlFactory.js financial/IXIFinancialPermissionEngine.js financial/IXIFinancialRoutes.js financial/IXIFinancialValidationBridge.js'
          EXISTING='financial/IXIFinancialCloseControlEngine.js financial/IXIFinancialCommandEngine.js financial/IXIFinancialCommandRoutes.js financial/IXIFinancialDocumentFactoryRegistry.js financial/IXIFinancialPermissionEngine.js financial/IXIFinancialRoutes.js financial/IXIFinancialValidationBridge.js'
          SUCCESS=0

          run_pm2() { if [ "$PM2_USER" = root ]; then pm2 "$@"; else sudo -u ubuntu -H pm2 "$@"; fi; }
          rollback() {
            if [ "$SUCCESS" -eq 0 ] && [ -f "$BACKUP" ]; then
              echo 'Deployment failed; restoring previous IX-Core source.' >&2
              cd "$APP"
              tar -xzf "$BACKUP"
              run_pm2 reload IX-Core --update-env || run_pm2 restart IX-Core --update-env || true
            fi
          }
          trap rollback EXIT

          test -d "$APP"
          if pm2 describe IX-Core >/dev/null 2>&1; then PM2_USER=root;
          elif sudo -u ubuntu -H pm2 describe IX-Core >/dev/null 2>&1; then PM2_USER=ubuntu;
          else echo 'PM2 process IX-Core was not found.' >&2; exit 1; fi

          cd "$APP"
          printf '%s  %s\n' \
            '16b7f831eb0702cd4e80dd690781466a829100cac1deb6850e687ad3de57e436' 'financial/IXIFinancialCloseControlEngine.js' \
            'fd008484b5b1bf06ae45f023e70c4bdc19e13d1da09832d98c457c2fb2a20844' 'financial/IXIFinancialCommandEngine.js' \
            '370b81328fcf0302a1c299f96fd952f7ce3a2203ef3855c5a9cbffa3154314ed' 'financial/IXIFinancialCommandRoutes.js' \
            '4739482ba21e1d3f080f2cbd140e844acb564bfd6b2607dac0e5e65eb81d7cf5' 'financial/IXIFinancialDocumentFactoryRegistry.js' \
            '63ba7308b12bc8d1d0d6c7968e78125d08b58fced6f96b6e24d970a35e272629' 'financial/IXIFinancialPermissionEngine.js' \
            '1eb89f04e09569b285a9aa8d045bb1845d6cd3bec6b565d63937c40179e4895a' 'financial/IXIFinancialRoutes.js' \
            '5a66779634db25cc94853467c03f12c46c47e64440bb0e9bae62522a2250a3d6' 'financial/IXIFinancialValidationBridge.js' | sha256sum -c -

          mkdir -p /var/backups/ixi-core-releases
          tar -czf "$BACKUP" $EXISTING
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          curl -fsSL "https://github.com/tarpbarry-stack/ixi-core/archive/$RELEASE_SHA.tar.gz" -o "$ARCHIVE"
          tar -xzf "$ARCHIVE" --strip-components=1 -C "$STAGE"

          cd "$STAGE"
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=low
          npm test
          for file in $CHANGED; do node --check "$file"; done
          node - <<'NODE'
          const {buildFinancialGLProjection}=require('./financial/IXIFinancialGLProjectionEngine');
          const journal={financialDocumentId:'ifd_gl_probe',documentType:'journal-entry',financialState:'posted',status:'posted',currency:'USD',period:'2026-09',occurredAt:'2026-09-03',accounting:{balanced:true},lines:[{accountCode:'1010',debit:100,credit:0},{accountCode:'4100',debit:0,credit:100}]};
          const projection=buildFinancialGLProjection({records:[journal],period:'2026-09',currency:'USD'});
          if(projection.schema!=='ixi-financial-gl-projection-v2'||projection.chart.source!=='ixi-core'||projection.postingRules.source!=='ixi-core-dynamodb'||projection.controls.closeCertification.browserCalculated!==false||!projection.trialBalance.balanced||!projection.balanceSheet.balanced) throw new Error('General Ledger deploy probe failed.');
          const {createCollectionDocument,createSettlementDocument}=require('./financial/IXIFinancialOperationalControlFactory');
          const collection=createCollectionDocument({sourceFinancialDocumentId:'ifd_invoice_probe',entityPassportId:'pass_entity_probe',actorPassportId:'pass_actor_probe',references:[{role:'entity',passportId:'pass_entity_probe'}],collectionCase:{receivable:{invoiceId:'ifd_invoice_probe',originalAmount:100,openBalance:100},customer:{label:'Probe'},status:'open'}});
          const settlement=createSettlementDocument({sourceFinancialDocumentId:'ifd_sale_probe',entityPassportId:'pass_entity_probe',actorPassportId:'pass_actor_probe',references:[{role:'entity',passportId:'pass_entity_probe'}],assetSettlement:{context:{assetPassportId:'pass_asset_probe'},references:{saleId:'ifd_sale_probe'},waterfall:{shareTotal:100,balanced:true,totalFinalDue:100,owners:[{ownerId:'owner_probe',label:'Probe Owner',finalDue:100,balanceDue:100}]},controls:{approvalNote:'deployment probe'},status:'ready',paymentStatus:'unpaid'}});
          if(collection.documentType!=='collection'||settlement.documentType!=='settlement'||collection.accountingTreatment.economicEvent!==false||settlement.accountingTreatment.economicEvent!==false) throw new Error('Operational controls deploy probe failed.');
          NODE

          cd "$APP"
          for file in $CHANGED; do install -D -m 0644 "$STAGE/$file" "$APP/$file"; done
          run_pm2 reload IX-Core --update-env
          attempt=0
          until curl -fsS http://127.0.0.1:4100/health >/dev/null; do attempt=$((attempt + 1)); [ "$attempt" -lt 15 ] || exit 1; sleep 2; done
          gl_status="$(curl -sS -o "$STAGE/gl-route.json" -w '%{http_code}' http://127.0.0.1:4100/financial/gl?period=2026-09)"
          close_status="$(curl -sS -o "$STAGE/close-route.json" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"period":"2026-09","currency":"USD"}' http://127.0.0.1:4100/financial/commands/desktop/close-period)"
          reopen_status="$(curl -sS -o "$STAGE/reopen-route.json" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"period":"2026-09","currency":"USD","reopenReason":"deployment authorization probe"}' http://127.0.0.1:4100/financial/commands/desktop/reopen-period)"
          rule_status="$(curl -sS -o "$STAGE/rule-route.json" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"postingRule":{}}' http://127.0.0.1:4100/financial/commands/desktop/posting-rules)"
          collection_status="$(curl -sS -o "$STAGE/collection-route.json" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"documentType":"collection","input":{"sourceFinancialDocumentId":"ifd_invoice_probe","collectionCase":{"receivable":{"invoiceId":"ifd_invoice_probe","originalAmount":100,"openBalance":100},"customer":{"label":"Probe"}}}}' http://127.0.0.1:4100/financial/commands/create)"
          settlement_status="$(curl -sS -o "$STAGE/settlement-route.json" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"documentType":"settlement","input":{"sourceFinancialDocumentId":"ifd_sale_probe","assetSettlement":{"context":{"assetPassportId":"pass_asset_probe"},"references":{"saleId":"ifd_sale_probe"},"waterfall":{"shareTotal":100,"balanced":true,"totalFinalDue":100,"owners":[{"ownerId":"owner_probe","label":"Probe Owner","finalDue":100,"balanceDue":100}]},"controls":{"approvalNote":"deployment probe"},"status":"ready","paymentStatus":"unpaid"}}}' http://127.0.0.1:4100/financial/commands/create)"
          case "$gl_status" in 401|403) ;; *) cat "$STAGE/gl-route.json" >&2; exit 1 ;; esac
          case "$close_status" in 401|403) ;; *) cat "$STAGE/close-route.json" >&2; exit 1 ;; esac
          case "$reopen_status" in 401|403) ;; *) cat "$STAGE/reopen-route.json" >&2; exit 1 ;; esac
          case "$rule_status" in 401|403) ;; *) cat "$STAGE/rule-route.json" >&2; exit 1 ;; esac
          case "$collection_status" in 401|403) ;; *) cat "$STAGE/collection-route.json" >&2; exit 1 ;; esac
          case "$settlement_status" in 401|403) ;; *) cat "$STAGE/settlement-route.json" >&2; exit 1 ;; esac

          SUCCESS=1
          trap - EXIT
          rm -rf "$STAGE"
          rm -f "$ARCHIVE"
          printf 'IX-Core Financial Controls %s deployed; health=200; gl=%s; close=%s; reopen=%s; rules=%s; collections=%s; settlement=%s\n' "$RELEASE_SHA" "$gl_status" "$close_status" "$reopen_status" "$rule_status" "$collection_status" "$settlement_status"
          REMOTE_SCRIPT
          )"
          remote_script="${remote_script//__IXI_CORE_SHA__/$IXI_CORE_SHA}"
          parameters="$(jq -cn --arg command "$remote_script" '{commands:[$command]}')"
          command_id="$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$AWS_INSTANCE_ID" --document-name AWS-RunShellScript --comment "Deploy IX-Core General Ledger $IXI_CORE_SHA" --parameters "$parameters" --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --region "$AWS_REGION" --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID" || true
          invocation="$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID")"
          printf '%s' "$invocation" | jq -r '.StandardOutputContent'
          printf '%s' "$invocation" | jq -r '.StandardErrorContent' >&2
          test "$(printf '%s' "$invocation" | jq -r '.Status')" = Success

      - name: Record General Ledger release
        shell: bash
        run: |
          {
            echo '## IX-Core Financial Controls release'
            echo "- Commit: `$IXI_CORE_SHA`"
            echo '- 73 Financial tests and operational-control invariants: passed'
            echo '- Production dependency audit: passed'
            echo '- Health and protected GL / close / reopen / posting-rule / Collections / Settlement routes: passed'
          } >> "$GITHUB_STEP_SUMMARY"
