name: Deploy IX-Core Freight

"on":
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Immutable IX-Core commit SHA
        required: true
        default: bf3114cbc329523206993d3b9a4411de11df03f5
  push:
    branches: [main]
    paths: [".github/workflows/deploy-ixi-core-freight.yml"]

permissions:
  contents: read

concurrency:
  group: ixi-core-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
      IXI_CORE_SHA: ${{ inputs.commit_sha || 'bf3114cbc329523206993d3b9a4411de11df03f5' }}
    steps:
      - name: Validate immutable release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IXI_CORE_SHA" =~ ^[0-9a-f]{40}$ ]]
          resolved_sha="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/tarpbarry-stack/ixi-core/commits/$IXI_CORE_SHA" | jq -r '.sha')"
          test "$resolved_sha" = "$IXI_CORE_SHA"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy guarded Freight release
        shell: bash
        run: |
          set -euo pipefail
          remote_script="$(cat <<'REMOTE_SCRIPT'
          set -eu
          APP=/var/www/ix-core
          RELEASE_SHA=__IXI_CORE_SHA__
          STAGE=/tmp/ixi-core-freight-__IXI_CORE_SHA__
          ARCHIVE=/tmp/ixi-core-freight-__IXI_CORE_SHA__.tgz
          BACKUP=/var/backups/ixi-core-releases/freight-pre-__IXI_CORE_SHA__.tgz
          RUNTIME_FILES='index.js freight/routes/freightAuthenticatedRequest.js'
          CHECKSUM_FILE='freight/routes/freightAuthenticatedRequest.js'
          STAGE_FILES='index.js freight/constants.js freight/contracts/freightOrderContract.js freight/routes/freightAuthenticatedRequest.js freight/routes/freightRouter.js freight/services/freightService.js'
          SUCCESS=0
          ROLLBACK_ARMED=0

          run_pm2() { if [ "$PM2_USER" = root ]; then pm2 "$@"; else sudo -u ubuntu -H pm2 "$@"; fi; }
          rollback() {
            if [ "$SUCCESS" -eq 0 ] && [ "$ROLLBACK_ARMED" -eq 1 ] && [ -f "$BACKUP" ]; then
              echo 'Deployment failed; restoring prior Freight runtime.' >&2
              cd "$APP"
              tar -xzf "$BACKUP"
              run_pm2 reload IX-Core --update-env || run_pm2 restart IX-Core --update-env || true
            fi
          }
          trap rollback EXIT

          test -d "$APP"
          if pm2 describe IX-Core >/dev/null 2>&1; then PM2_USER=root
          elif sudo -u ubuntu -H pm2 describe IX-Core >/dev/null 2>&1; then PM2_USER=ubuntu
          else echo 'PM2 process IX-Core was not found.' >&2; exit 1
          fi

          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          curl -fsSL "https://github.com/tarpbarry-stack/ixi-core/archive/$RELEASE_SHA.tar.gz" -o "$ARCHIVE"
          tar -xzf "$ARCHIVE" --strip-components=1 -C "$STAGE"

          cd "$APP"
          ALREADY_CURRENT=1
          cmp -s "$APP/$CHECKSUM_FILE" "$STAGE/$CHECKSUM_FILE" || ALREADY_CURRENT=0
          grep -A4 '"/freight/v1"' "$APP/index.js" | grep -q 'ixiInternalFinancialRequest' || ALREADY_CURRENT=0
          if [ "$ALREADY_CURRENT" -ne 1 ]; then
            printf '%s  %s\n' \
              'bbce203a0381957b728bdb8d7e45756851f7ae8d44a50fb360f5ee614698f2c3' 'freight/routes/freightAuthenticatedRequest.js' | sha256sum -c -
            grep -q 'const.*ixiInternalFinancialRequest' "$APP/index.js"
            grep -q '"/financial"' "$APP/index.js"
            grep -q '"/freight/v1"' "$APP/index.js"
          fi

          cd "$STAGE"
          npm ci --ignore-scripts --no-audit
          npm test
          for file in $STAGE_FILES; do node --check "$file"; done
          node - <<'NODE'
          const {freightRouter}=require('./freight/routes/freightRouter');
          const service=require('./freight/services/freightService');
          const paths=freightRouter.stack.map(layer=>layer.route?.path).filter(Boolean);
          if(!paths.includes('/orders/:freightOrderId/invoice')) throw new Error('Freight invoice route missing.');
          if(typeof service.attachInvoice!=='function') throw new Error('Freight invoice service missing.');
          NODE

          if [ "$ALREADY_CURRENT" -ne 1 ]; then
            cd "$APP"
            mkdir -p /var/backups/ixi-core-releases
            tar -czf "$BACKUP" $RUNTIME_FILES
            ROLLBACK_ARMED=1
            install -D -m 0644 "$STAGE/$CHECKSUM_FILE" "$APP/$CHECKSUM_FILE"
            node - "$APP/index.js" <<'NODE'
          const fs=require('fs');
          const path=process.argv[2];
          let source=fs.readFileSync(path,'utf8');
          const internal='ixiInternalFinancialRequest';
          const routeStart=source.indexOf('"/freight/v1"');
          if(routeStart<0) throw new Error('Live Freight route mount missing.');
          const routeWindow=source.slice(routeStart,routeStart+260);
          if(!routeWindow.includes(internal)){
            const anchor='"/freight/v1",\n  ixiAuthenticatedFinancialRequest,';
            if(source.split(anchor).length!==2) throw new Error('Live Freight authentication mount is ambiguous.');
            source=source.replace(anchor,'"/freight/v1",\n  ixiInternalFinancialRequest,\n  ixiAuthenticatedFinancialRequest,');
          }
          const next=`${path}.freight-auth-next`;
          fs.writeFileSync(next,source,{mode:0o644});
          fs.renameSync(next,path);
          NODE
            run_pm2 reload IX-Core --update-env
          fi

          attempt=0
          until curl -fsS http://127.0.0.1:4100/health >/dev/null; do
            attempt=$((attempt + 1))
            [ "$attempt" -lt 20 ] || exit 1
            sleep 2
          done
          cd "$APP"
          printf '%s  %s\n' \
            '2795f89f5a203129756a808f96fbb6c2d374d820a5bc0244abde9e6f30603b9f' 'freight/routes/freightAuthenticatedRequest.js' | sha256sum -c -
          grep -A4 '"/freight/v1"' "$APP/index.js" | grep -q 'ixiInternalFinancialRequest'

          SUCCESS=1
          ROLLBACK_ARMED=0
          trap - EXIT
          rm -rf "$STAGE"
          rm -f "$ARCHIVE"
          printf 'IX-Core Freight %s deployed; health=200; invoice-route=present\n' "$RELEASE_SHA"
          REMOTE_SCRIPT
          )"
          remote_script="${remote_script//__IXI_CORE_SHA__/$IXI_CORE_SHA}"
          parameters="$(jq -cn --arg command "$remote_script" '{commands:[$command]}')"
          command_id="$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$AWS_INSTANCE_ID" --document-name AWS-RunShellScript --comment "Deploy IX-Core Freight $IXI_CORE_SHA" --parameters "$parameters" --query 'Command.CommandId' --output text)"
          invocation=''
          status='Pending'
          for attempt in $(seq 1 240); do
            invocation="$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID" 2>/dev/null || true)"
            status="$(printf '%s' "$invocation" | jq -r '.Status // "Pending"')"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break ;; esac
            sleep 5
          done
          printf '%s' "$invocation" | jq -r '.StandardOutputContent'
          printf '%s' "$invocation" | jq -r '.StandardErrorContent' >&2
          test "$status" = Success

      - name: Record Freight release
        shell: bash
        run: |
          {
            echo '## IX-Core Freight release'
            printf -- '- Commit: `%s`\n' "$IXI_CORE_SHA"
            echo '- 90 Financial, Freight, and Sales control tests: passed'
            echo '- Live source checksum and rollback controls: passed'
            echo '- AWS IX-Core health and Freight invoice-route probes: passed'
          } >> "$GITHUB_STEP_SUMMARY"
