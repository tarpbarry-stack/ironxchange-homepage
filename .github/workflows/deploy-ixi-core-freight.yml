name: Deploy IX-Core Freight

"on":
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Immutable IX-Core commit SHA
        required: true
        default: 5dd4b09d7fa0720edd494583eda6d63291972b23
  push:
    branches: [main]
    paths: [".github/workflows/deploy-ixi-core-freight.yml"]

permissions:
  contents: read

concurrency:
  group: ixi-core-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
      IXI_CORE_SHA: ${{ inputs.commit_sha || '5dd4b09d7fa0720edd494583eda6d63291972b23' }}
    steps:
      - name: Validate immutable release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IXI_CORE_SHA" =~ ^[0-9a-f]{40}$ ]]
          resolved_sha="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/tarpbarry-stack/ixi-core/commits/$IXI_CORE_SHA" | jq -r '.sha')"
          test "$resolved_sha" = "$IXI_CORE_SHA"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy guarded Freight release
        shell: bash
        run: |
          set -euo pipefail
          remote_script="$(cat <<'REMOTE_SCRIPT'
          set -eu
          APP=/var/www/ix-core
          RELEASE_SHA=__IXI_CORE_SHA__
          STAGE=/tmp/ixi-core-freight-__IXI_CORE_SHA__
          ARCHIVE=/tmp/ixi-core-freight-__IXI_CORE_SHA__.tgz
          BACKUP=/var/backups/ixi-core-releases/freight-pre-__IXI_CORE_SHA__.tgz
          RUNTIME_FILES='freight/services/freightService.js freight/services/freightEconomics.js'
          DEPLOY_FILES="$RUNTIME_FILES"
          SUCCESS=0
          ROLLBACK_ARMED=0

          run_pm2() { if [ "$PM2_USER" = root ]; then pm2 "$@"; else sudo -u ubuntu -H pm2 "$@"; fi; }
          rollback() {
            if [ "$SUCCESS" -eq 0 ] && [ "$ROLLBACK_ARMED" -eq 1 ] && [ -f "$BACKUP" ]; then
              echo 'Deployment failed; restoring prior Freight runtime.' >&2
              cd "$APP"
              tar -xzf "$BACKUP"
              run_pm2 reload IX-Core --update-env || run_pm2 restart IX-Core --update-env || true
            fi
          }
          trap rollback EXIT

          test -d "$APP"
          if pm2 describe IX-Core >/dev/null 2>&1; then PM2_USER=root
          elif sudo -u ubuntu -H pm2 describe IX-Core >/dev/null 2>&1; then PM2_USER=ubuntu
          else echo 'PM2 process IX-Core was not found.' >&2; exit 1
          fi

          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          curl -fsSL "https://github.com/tarpbarry-stack/ixi-core/archive/$RELEASE_SHA.tar.gz" -o "$ARCHIVE"
          tar -xzf "$ARCHIVE" --strip-components=1 -C "$STAGE"

          cd "$APP"
          ALREADY_CURRENT=1
          for file in $DEPLOY_FILES; do
            test -f "$APP/$file" && cmp -s "$APP/$file" "$STAGE/$file" || ALREADY_CURRENT=0
          done
          if [ "$ALREADY_CURRENT" -ne 1 ]; then
            printf '%s  %s\n' \
              '6350b10dafd61f88388a793ce565dde9e7beb7bb405ca174628e67054fa34e59' 'freight/services/freightService.js' \
              '79023d40197a2ac42ce660f1e53efc830d7711ffc79cf7b59b51aa22446d73fd' 'freight/services/freightEconomics.js' \
              'b84be7d4cb67e774545ae5499b7d74ddc15986ad5b9192f30bbe8e47bdda18b7' 'passport/passportRegistry.js' \
              'a598ea6ac8b72d98f2e0707f636d96a75fc476a4d793b22501d88852d8d61b91' 'mos/provisioning/aosObjectIdentityResolver.js' | sha256sum -c -
          fi

          cd "$STAGE"
          npm ci --ignore-scripts --no-audit
          npm test
          for file in $DEPLOY_FILES; do node --check "$file"; done
          node - <<'NODE'
          const service=require('./freight/services/freightService');
          const resolver=require('./mos/provisioning/aosObjectIdentityResolver');
          const registry=require('./passport/passportRegistry');
          if(typeof service.create!=='function') throw new Error('Freight create service missing.');
          if(typeof resolver.resolveOrProvisionAosObjectForPassport!=='function') throw new Error('Passport resolver missing.');
          if(typeof registry.bindPassportSource!=='function') throw new Error('Passport source binding missing.');
          NODE

          if [ "$ALREADY_CURRENT" -ne 1 ]; then
            cd "$APP"
            mkdir -p /var/backups/ixi-core-releases
            tar -czf "$BACKUP" $RUNTIME_FILES
            ROLLBACK_ARMED=1
            for file in $DEPLOY_FILES; do
              install -D -m 0644 "$STAGE/$file" "$APP/$file"
            done
            run_pm2 reload IX-Core --update-env
          fi

          attempt=0
          until curl -fsS http://127.0.0.1:4100/health >/dev/null; do
            attempt=$((attempt + 1))
            [ "$attempt" -lt 20 ] || exit 1
            sleep 2
          done
          cd "$APP"
          printf '%s  %s\n' \
            '31068c1f776f68ba4a864d70a5d136148037729ebb880ea604988fc2d95d5418' 'freight/services/freightService.js' \
            '775ba03f1da5f5523cc692ed71e49388c8d5ad29229deddf465ebb59c1f45a8c' 'freight/services/freightEconomics.js' \
            'b84be7d4cb67e774545ae5499b7d74ddc15986ad5b9192f30bbe8e47bdda18b7' 'passport/passportRegistry.js' \
            'a598ea6ac8b72d98f2e0707f636d96a75fc476a4d793b22501d88852d8d61b91' 'mos/provisioning/aosObjectIdentityResolver.js' | sha256sum -c -
          node - <<'NODE'
          const resolver=require('./mos/provisioning/aosObjectIdentityResolver');
          if(typeof resolver.resolveOrProvisionAosObjectForPassport!=='function') throw new Error('Live Passport resolver missing.');
          NODE

          SUCCESS=1
          ROLLBACK_ARMED=0
          trap - EXIT
          rm -rf "$STAGE"
          rm -f "$ARCHIVE"
          printf 'IX-Core Freight %s deployed; health=200; passport-resolver=present\n' "$RELEASE_SHA"
          REMOTE_SCRIPT
          )"
          remote_script="${remote_script//__IXI_CORE_SHA__/$IXI_CORE_SHA}"
          parameters="$(jq -cn --arg command "$remote_script" '{commands:[$command]}')"
          command_id="$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$AWS_INSTANCE_ID" --document-name AWS-RunShellScript --comment "Deploy IX-Core Freight $IXI_CORE_SHA" --parameters "$parameters" --query 'Command.CommandId' --output text)"
          invocation=''
          status='Pending'
          for attempt in $(seq 1 240); do
            invocation="$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID" 2>/dev/null || true)"
            status="$(printf '%s' "$invocation" | jq -r '.Status // "Pending"')"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break ;; esac
            sleep 5
          done
          printf '%s' "$invocation" | jq -r '.StandardOutputContent'
          printf '%s' "$invocation" | jq -r '.StandardErrorContent' >&2
          test "$status" = Success

      - name: Record Freight release
        shell: bash
        run: |
          {
            echo '## IX-Core Freight release'
            printf -- '- Commit: `%s`\n' "$IXI_CORE_SHA"
            echo '- 96 Financial, Freight, Passport, and Sales control tests: passed'
            echo '- Live source checksum and rollback controls: passed'
            echo '- AWS IX-Core health and Passport resolver probes: passed'
          } >> "$GITHUB_STEP_SUMMARY"
