name: Build AWS Taxonomy Master

on:
  workflow_dispatch:
  push:
    paths:
      - "lib/skidSteerCtlTaxonomy.js"
      - "scripts/buildAwsTaxonomyMaster.js"
      - "package.json"

permissions:
  contents: write

jobs:
  build-taxonomy-master:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Build AWS taxonomy master
        run: npm run build-aws-taxonomy-master

      - name: Commit generated taxonomy master
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Build AWS taxonomy master"
          file_pattern: config/awsTaxonomyMaster.json
