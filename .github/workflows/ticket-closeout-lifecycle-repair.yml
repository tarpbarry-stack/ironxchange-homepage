name: Repair Ticket closeout lifecycle UX

on:
  push:
    branches:
      - ticket/commercial-aws-completion-v1
    paths:
      - .github/workflows/ticket-closeout-lifecycle-repair.yml

permissions:
  contents: write

jobs:
  repair-ticket-closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Ticket branch
        uses: actions/checkout@v4
        with:
          ref: ticket/commercial-aws-completion-v1
          fetch-depth: 0

      - name: Apply commercial operator model
        run: python3 .github/scripts/ticket_operator_model.py

      - name: Sanity checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SEND TO AGENT NOW' components/ixi-tickets/IXITicketWorksheet.jsx
          grep -q 'WORK READY QUEUE' components/ixi-tickets/IXITicketCommand.jsx
          grep -q 'START WORK ON THIS TICKET' components/ixi-tickets/IXITicketCommand.jsx
          grep -q 'AGENT RESULT — 1 TO 5' components/ixi-tickets/IXITicketCommand.jsx
          grep -q 'YOUR RESULT RATING — 1 TO 5' components/ixi-tickets/IXITicketCommand.jsx
          grep -q 'export async function startRemoteTicket' lib/ixi-tickets/ixiTicketClient.js
          grep -q 'export async function rateRemoteTicket' lib/ixi-tickets/ixiTicketClient.js

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/ixi-tickets/ixiTicketClient.js \
            lib/ixi-tickets/IXITicketContract.js \
            components/ixi-tickets/IXITicketProvider.jsx \
            components/ixi-tickets/IXITicketWorksheet.jsx \
            components/ixi-tickets/IXITicketCommand.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Commercialize Ticket queue execution and dual ratings"
          git push origin HEAD:ticket/commercial-aws-completion-v1
