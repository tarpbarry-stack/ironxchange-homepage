name: IXI Mobile Owned Private Face 1 Certification

on:
  push:
    branches:
      - mobile/commercial-aos-v1-private-face1-current
    paths:
      - "components/ixi-machine-card/private/IXIOwnedPrivateListingRuntime.jsx"
      - "lib/ixi-mobile/IXIMobileRuntime.mjs"
      - "pages/mobile-aos-face1.js"
      - "tests/ixi-mobile-owned-private-face1-contract.test.mjs"
      - ".github/workflows/ixi-mobile-owned-private-face1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ixi-mobile-owned-private-face1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SHARETRIBE_CLIENT_ID: ci-placeholder

    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install repository dependencies
        run: npm install --no-audit --no-fund

      - name: Run owned private Face 1 contract
        run: node --test tests/ixi-mobile-owned-private-face1-contract.test.mjs

      - name: Build production application
        run: npm run build
