name: Finalize IXI Agent Bridge

on:
  push:
    branches:
      - ticket/commercial-agent-bridge-v1
    paths:
      - .github/workflows/ixi-agent-bridge-finalize.yml

permissions:
  contents: write

jobs:
  finalize-agent-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ticket/commercial-agent-bridge-v1
          fetch-depth: 0

      - name: Rewire Ticket UI to truthful dispatch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          client = Path('lib/ixi-tickets/ixiTicketClient.js')
          s = client.read_text()
          old = '''export async function startRemoteTicket(ticket, options = {}) {
  if (!ticket?.ticketId) throw new Error("Ticket ID is required to start work.");

  let remote = ticket;
  if (remote.status === "draft" || !Number.isInteger(remote.revision)) {
    remote = await setRemoteTicketReady(remote);
  }
  if (!["ready-for-chat", "reopened"].includes(remote.status)) return remote;

  const startedAt = new Date().toISOString();
  const assignedTo = clean(options.assignedTo) || "chat";
  const source = clean(options.source) || "manual";

  return extractTicket(await updateRemoteTicket(
    remote.ticketId,
    {
      status: "working",
      metadata: {
        ...(remote.metadata || {}),
        execution: {
          ...(remote.metadata?.execution || {}),
          assignedTo,
          claimedAt: remote.metadata?.execution?.claimedAt || startedAt,
          startedAt,
          source
        }
      }
    },
    remote.revision
  ));
}
'''
          new = '''export async function startRemoteTicket(ticket, options = {}) {
  if (!ticket?.ticketId) throw new Error("Ticket ID is required to request dispatch.");

  let remote = ticket;
  if (remote.status === "draft" || !Number.isInteger(remote.revision)) {
    remote = await setRemoteTicketReady(remote);
  }
  if (!["ready-for-chat", "reopened"].includes(remote.status)) return remote;

  const response = await fetch("/api/ixi-agent/dispatch", {
    method: "POST",
    credentials: "include",
    cache: "no-store",
    headers: {
      Accept: "application/json",
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      ticketId: remote.ticketId,
      expectedRevision: remote.revision,
      source: clean(options.source) || "ticket-command"
    })
  });

  let payload = null;
  try {
    payload = await response.json();
  } catch {
    payload = null;
  }

  if (!response.ok) {
    const error = new Error(payload?.error?.message || `Ticket dispatch failed (${response.status}).`);
    error.status = response.status;
    error.code = payload?.error?.code || "IXI_AGENT_DISPATCH_FAILED";
    error.details = payload?.error?.details || null;
    throw error;
  }

  return payload?.ticket || payload?.data?.ticket || payload?.data || remote;
}
'''
          if old not in s:
              raise SystemExit('startRemoteTicket marker not found')
          client.write_text(s.replace(old, new, 1))

          cmd = Path('components/ixi-tickets/IXITicketCommand.jsx')
          s = cmd.read_text()
          replacements = {
            'setActionNotice(`STARTED ${ticket.displayNumber} — status is now WORKING.`);': 'setActionNotice(`DISPATCH REQUESTED FOR ${ticket.displayNumber} — it remains READY until a real agent claims the full work packet.`);',
            'setActionNotice(error.message || "Ticket could not be started.");': 'setActionNotice(error.message || "Ticket could not be dispatched.");',
            'let started = 0;': 'let dispatched = 0;',
            'started += 1;': 'dispatched += 1;',
            '`Started ${started} Ticket(s). ${failures.length} failed: ${failures.join(" | ")}`': '`Dispatch requested for ${dispatched} Ticket(s). ${failures.length} failed: ${failures.join(" | ")}`',
            '`Started all ${started} Ready Ticket(s).`': '`Dispatch requested for all ${dispatched} Ready Ticket(s). They remain READY until claimed by an agent.`',
            '{actionBusy ? "WORKING..." : `WORK READY QUEUE (${counts.ready})`}': '{actionBusy ? "DISPATCHING..." : `DISPATCH READY QUEUE (${counts.ready})`}',
            '>START WORK ON THIS TICKET</button>': '>DISPATCH THIS TICKET TO AGENT</button>'
          }
          for old_text, new_text in replacements.items():
              if old_text not in s:
                  raise SystemExit(f'command marker not found: {old_text}')
              s = s.replace(old_text, new_text, 1)
          cmd.write_text(s)

          ws = Path('components/ixi-tickets/IXITicketWorksheet.jsx')
          s = ws.read_text()
          replacements = {
            'if (!remote?.ticketId) throw new Error("IXI Ticket API did not return a working Ticket.");': 'if (!remote?.ticketId) throw new Error("IXI Agent Gateway did not return the dispatched Ticket.");',
            'setNotice("SENT TO AGENT — Ticket is WORKING now.");': 'setNotice("DISPATCH REQUESTED — Ticket remains READY until an agent claims the complete work packet.");'
          }
          for old_text, new_text in replacements.items():
              if old_text not in s:
                  raise SystemExit(f'worksheet marker not found: {old_text}')
              s = s.replace(old_text, new_text, 1)
          ws.write_text(s)
          PY

      - name: Contract checks
        shell: bash
        run: |
          set -euo pipefail
          node --check lib/ixi-agent/ixiAgentBridge.js
          grep -q 'status: "working"' lib/ixi-agent/ixiAgentBridge.js
          grep -q 'claimTicket' pages/api/ixi-agent/mcp.js
          grep -q 'heartbeatTicket' pages/api/ixi-agent/mcp.js
          grep -q 'submitAgentCloseout' pages/api/ixi-agent/mcp.js
          grep -q 'DISPATCH THIS TICKET TO AGENT' components/ixi-tickets/IXITicketCommand.jsx
          grep -q 'remains READY until an agent claims' components/ixi-tickets/IXITicketWorksheet.jsx
          ! grep -q 'status: "working"' lib/ixi-tickets/ixiTicketClient.js

      - name: Commit bridge wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ixi-tickets/ixiTicketClient.js components/ixi-tickets/IXITicketCommand.jsx components/ixi-tickets/IXITicketWorksheet.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Make Ticket WORKING require a real agent claim"
          git push origin HEAD:ticket/commercial-agent-bridge-v1
