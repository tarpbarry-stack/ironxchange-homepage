name: IXI TRANSACT V13 CI

on:
  pull_request:
    paths:
      - "components/ixi-transact-dashboard/**"
      - "pages/transact/**"
      - "pages/api/ixi-financial/**"
      - "scripts/verifyTransactDashboardContracts.mjs"
      - "scripts/verifyTransactActionExecutionContracts.mjs"
      - "next.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/transact-dashboard-ci.yml"
  push:
    branches:
      - agent/transact-dashboard-v13
    paths:
      - "components/ixi-transact-dashboard/**"
      - "pages/transact/**"
      - "pages/api/ixi-financial/**"
      - "scripts/verifyTransactDashboardContracts.mjs"
      - "scripts/verifyTransactActionExecutionContracts.mjs"
      - "next.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/transact-dashboard-ci.yml"

permissions:
  contents: write

concurrency:
  group: transact-v13-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SHARETRIBE_CLIENT_ID: "ixi-ci-build-placeholder"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect committed lockfile
        id: dependency-lock
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Commit generated dependency lock
        if: github.event_name == 'push' && steps.dependency-lock.outputs.exists == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock production npm dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Verify TRAN$ACT dashboard contracts
        run: npm run verify-transact-dashboard
      - name: Verify canonical action execution contracts
        run: node scripts/verifyTransactActionExecutionContracts.mjs
      - name: Build Next production application
        run: npm run build
