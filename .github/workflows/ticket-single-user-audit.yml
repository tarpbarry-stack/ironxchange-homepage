name: Audit IX-Core Ticket entity keys

on:
  push:
    branches:
      - ticket/commercial-aws-completion-v1
    paths:
      - .github/workflows/ticket-single-user-audit.yml

permissions:
  contents: read

jobs:
  audit-ticket-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read only Ticket entity keys on IX-Core host
        shell: bash
        run: |
          set -euo pipefail
          remote="cd /var/www/ix-core && node -e 'const {DynamoDBClient}=require(\"@aws-sdk/client-dynamodb\");const {DynamoDBDocumentClient,ScanCommand}=require(\"@aws-sdk/lib-dynamodb\");(async()=>{const d=DynamoDBDocumentClient.from(new DynamoDBClient({region:process.env.AWS_REGION||\"us-east-2\"}));const r=await d.send(new ScanCommand({TableName:process.env.IXI_TICKET_TABLE||\"IXITickets\",ProjectionExpression:\"entityId,pk\"}));for(const x of r.Items||[]) console.log([x.entityId||\"\",x.pk||\"\"].join(\"\\t\"))})().catch(e=>{console.error(e.name,e.message);process.exit(1)})'"
          parameters="$(jq -cn --arg command "$remote" '{commands:[$command]}')"
          command_id="$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$AWS_INSTANCE_ID" --document-name AWS-RunShellScript --comment "Read IX-Core Ticket entity keys" --parameters "$parameters" --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --region "$AWS_REGION" --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID"
          aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID" --query 'StandardOutputContent' --output text
