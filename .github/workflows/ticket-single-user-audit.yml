name: Audit IX-Core Ticket entity keys

on:
  push:
    branches:
      - ticket/commercial-aws-completion-v1
    paths:
      - .github/workflows/ticket-single-user-audit.yml

permissions:
  contents: read

jobs:
  audit-ticket-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read Ticket keys as IX-Core service user
        shell: bash
        run: |
          set -euo pipefail
          remote="sudo -u ubuntu sh -lc 'cd /var/www/ix-core && node -e '\''const {DynamoDBClient}=require(\"@aws-sdk/client-dynamodb\");const {DynamoDBDocumentClient,QueryCommand}=require(\"@aws-sdk/lib-dynamodb\");(async()=>{const d=DynamoDBDocumentClient.from(new DynamoDBClient({region:\"us-east-2\"}));for(const repo of [\"ironxchange-homepage\",\"ixi-core\",\"other\"]){try{const r=await d.send(new QueryCommand({TableName:\"IXITickets\",IndexName:\"gsi2\",KeyConditionExpression:\"gsi2pk = :pk\",ExpressionAttributeValues:{\":pk\":`REPOSITORY#${repo}`}}));for(const x of r.Items||[]) console.log([repo,x.entityId||\"\",x.ticketId||\"\",x.status||\"\"].join(\"\\t\"))}catch(e){console.error(repo,e.name,e.message)}}})()'\'''"
          parameters="$(jq -cn --arg command "$remote" '{commands:[$command]}')"
          command_id="$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$AWS_INSTANCE_ID" --document-name AWS-RunShellScript --comment "Read IX-Core Ticket keys" --parameters "$parameters" --query 'Command.CommandId' --output text)"
          set +e
          aws ssm wait command-executed --region "$AWS_REGION" --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID"
          set -e
          echo "STDOUT"
          aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID" --query 'StandardOutputContent' --output text
          echo "STDERR"
          aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID" --query 'StandardErrorContent' --output text
