name: Audit IX-Core Ticket mount chain

on:
  push:
    branches:
      - ticket/commercial-aws-completion-v1
    paths:
      - .github/workflows/ticket-single-user-audit.yml

permissions:
  contents: read

jobs:
  audit-ticket-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Inspect Ticket mount chain
        shell: bash
        run: |
          set -euo pipefail
          remote='set -eu; echo "INDEX_TICKET_MOUNTS"; grep -n -C 12 -E "ticketRouter|ticketAuthenticatedRequest|/tickets/v1|ixiTicket" /var/www/ix-core/index.js || true; echo "ROUTER_EXPORTS"; tail -n 35 /var/www/ix-core/tickets/routes/ticketRouter.js'
          parameters="$(jq -cn --arg command "$remote" '{commands:[$command]}')"
          command_id="$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$AWS_INSTANCE_ID" --document-name AWS-RunShellScript --comment "Audit IX-Core Ticket mount" --parameters "$parameters" --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --region "$AWS_REGION" --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID"
          aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID" --query 'StandardOutputContent' --output text
