name: Diagnose IX-Core recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-ixi-core-recovery.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_REGION: us-east-2
      AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Read service, recovery and installed-release evidence
        run: |
          set -euo pipefail
          test "$AWS_INSTANCE_ID" = i-06d9ae98889f6fdab
          test "$(aws sts get-caller-identity --query Account --output text)" = 459212966383
          python3 - <<'PY'
          import json,os,pathlib
          command = r'''set -eu
          python3 - <<'SPACE'
          import json,os,pathlib,subprocess
          stat=os.statvfs('/')
          print(json.dumps({'disk':{'totalBytes':stat.f_blocks*stat.f_frsize,'availableBytes':stat.f_bavail*stat.f_frsize,'availableInodes':stat.f_favail}}))
          for root in ['/var/tmp','/var/backups/ixi-core-releases','/var/lib','/var/www','/home/ubuntu','/var/log','/tmp']:
              if not pathlib.Path(root).exists():
                  continue
              result=subprocess.run(['du','-x','-B1','--max-depth=1',root],capture_output=True,text=True,timeout=35)
              sizes=[]
              for line in result.stdout.splitlines():
                  parts=line.split('\t',1)
                  if len(parts)==2 and parts[0].isdigit():
                      sizes.append({'bytes':int(parts[0]),'path':parts[1]})
              print(json.dumps({'usageRoot':root,'largest':sorted(sizes,key=lambda item:item['bytes'],reverse=True)[:8],'exitCode':result.returncode}))
          SPACE
          systemctl show ixi-core-recovery.service -p ActiveState -p SubState -p Result -p ExecMainStatus -p ExecMainStartTimestamp -p ExecMainExitTimestamp
          systemctl show ixi-core-recovery.timer -p ActiveState -p SubState -p NextElapseUSecRealtime
          journalctl -u ixi-core-recovery.service -n 35 --no-pager -o cat
          node /var/www/ix-core/ops/runtime-release.js verify /var/www/ix-core /var/www/ix-core/.ixi-release.json
          python3 - <<'EVIDENCE'
          import json,pathlib
          root=pathlib.Path('/var/backups/ixi-core-releases')
          for path in [root/'latest-recovery.json',root/'source-before-e6b24d20ee4039ab5f373abef9725372937548e5-20260913T182940Z'/'recovery-receipt.json']:
              if path.exists():
                  value=json.loads(path.read_text())
                  print(json.dumps({'receipt':path.name,**{key:value.get(key) for key in ['ok','bucket','key','versionId','sha256','consistency','census']}}))
          EVIDENCE
          curl --max-time 5 -fsS http://127.0.0.1:4100/live
          curl --max-time 5 -fsS http://127.0.0.1:4100/ready
          '''
          pathlib.Path(os.environ['RUNNER_TEMP'],'recovery-diagnostic.json').write_text(json.dumps({'commands':[command],'executionTimeout':['120']}))
          PY
          command_id="$(aws ssm send-command --instance-ids "$AWS_INSTANCE_ID" --document-name AWS-RunShellScript --comment 'Read-only IX-Core recovery diagnosis' --parameters "file://$RUNNER_TEMP/recovery-diagnostic.json" --query Command.CommandId --output text)"
          echo "SSM diagnosis: $command_id"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID" --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' --output json
