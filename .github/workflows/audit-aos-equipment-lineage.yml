name: Audit AOS Equipment lineage

on:
  push:
    branches:
      - audit/aos-equipment-lineage-20260909
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Audit immutable Equipment lineage
        id: audit
        shell: bash
        run: |
          set -euo pipefail

          remote_script="$(cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd /var/www/ix-core
          IXI_MOS_STORAGE_PROVIDER=sqlite \
          IXI_MOS_SQLITE_PATH=/var/lib/ixi-core/mos/ixi-aos.sqlite \
          IXI_MOS_DATA_ROOT=/var/lib/ixi-core/mos \
          IXI_PASSPORT_DATA_FILE=/var/www/ix-core/passport/passports.json \
          NODE_PATH=/var/www/ix-core/node_modules \
          node - <<'NODE'
          const assert = require("node:assert/strict");
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const Database = require("better-sqlite3");
          const { MOS_PATHS } = require("./mos/storage/mosPaths");
          const { readJsonFile } = require("./mos/storage/jsonStore");
          const { resolveCanonicalObjectIdentity } = require("./mos/identity/canonicalObjectAdmissionService");
          const { buildRailProjectionMap } = require("./mos/accounts/aosEnvironmentService");

          const entityId = "entity_4d78e9fb-92e4-4cc2-a8cb-1a2f19e097d0";
          const databasePath = process.env.IXI_MOS_SQLITE_PATH;
          const passportPath = process.env.IXI_PASSPORT_DATA_FILE;
          const db = new Database(databasePath, { readonly: true });
          const state = () => ({
            rows: db.prepare("SELECT collection_key, version, payload_sha256 FROM mos_collections ORDER BY collection_key").all(),
            passportSha256: crypto.createHash("sha256").update(fs.readFileSync(passportPath)).digest("hex")
          });
          const before = state();
          assert.deepEqual(db.pragma("integrity_check"), [{ integrity_check: "ok" }]);

          const objects = Object.values(readJsonFile(MOS_PATHS.objects, {}))
            .filter(object => object.entityId === entityId && object.status === "active");
          const relationships = Object.values(readJsonFile(MOS_PATHS.relationships, {}))
            .filter(item => item.entityId === entityId && item.status === "active");
          const account = Object.values(readJsonFile(MOS_PATHS.accounts, {}))
            .find(item => item.primaryEntityId === entityId && item.status === "active");
          assert.ok(account?.ownerUserId);
          const machines = objects.filter(object => object.objectType === "machine");
          const equipment = objects.filter(object =>
            object.objectType === "system-index" &&
            object.metadata?.adapterId === "ixi-owned-equipment" &&
            object.metadata?.systemIndexPresentation === true
          );
          assert.equal(machines.length, 23);
          assert.equal(equipment.length, 1);

          const members = buildRailProjectionMap(relationships, objects)[equipment[0].objectId]?.members || [];
          assert.equal(members.length, 23);

          const lineage = machines.map(machine => {
            const identity = resolveCanonicalObjectIdentity({
              entityId,
              objectId: machine.objectId
            });
            const listingAliases = identity.aliases
              .filter(alias => alias.sourceType === "sharetribe-listing")
              .map(alias => alias.sourceId);
            return {
              objectId: identity.objectId,
              passportId: identity.passportId,
              displayName: identity.object.displayName,
              listingAliases
            };
          }).sort((left, right) => left.objectId.localeCompare(right.objectId));

          assert.deepEqual(state(), before, "Read-only lineage audit mutated canonical state");
          db.close();
          console.log(JSON.stringify({
            ok: true,
            ownerUserId: account.ownerUserId,
            activeMachineCount: machines.length,
            equipmentProjectionCount: members.length,
            machinesWithListingAlias: lineage.filter(item => item.listingAliases.length > 0).length,
            machinesWithoutListingAlias: lineage.filter(item => item.listingAliases.length === 0).length,
            lineage,
            immutableAudit: true
          }, null, 2));
          NODE
          REMOTE_SCRIPT
          )"

          remote_script_b64="$(printf '%s' "$remote_script" | base64 -w 0)"
          ssm_command="printf '%s' '$remote_script_b64' | base64 -d | bash"
          parameters="$(jq -cn --arg command "$ssm_command" '{commands:[$command]}')"
          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$AWS_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Read-only AOS Equipment lineage audit" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

          if ! aws ssm wait command-executed --region "$AWS_REGION" --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID"; then true; fi
          invocation="$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID")"
          printf '%s' "$invocation" | jq -r '.StandardOutputContent'
          printf '%s' "$invocation" | jq -r '.StandardErrorContent' >&2
          test "$(printf '%s' "$invocation" | jq -r '.Status')" = Success
