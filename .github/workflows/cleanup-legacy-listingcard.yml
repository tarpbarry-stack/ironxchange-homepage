name: Final Legacy ListingCard Cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-legacy-listingcard.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Migrate remaining ListingCard imports to current machine runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path("pages"), Path("components"), Path("lib")]
          extensions = {".js", ".jsx", ".ts", ".tsx"}

          # Match ONLY the retired default import identifier. This deliberately
          # does not match modern names such as AuctionListingCard,
          # PrivateListingCard or MarketplaceListingCard.
          import_pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)import\s+ListingCard\s+from\s+["\'](?P<src>[^"\']*/?ListingCard)["\'];?[ \t]*\n?'
          )

          changed = []

          for root in roots:
              if not root.exists():
                  continue

              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix not in extensions:
                      continue

                  text = path.read_text()
                  matches = list(import_pattern.finditer(text))

                  if not matches:
                      continue

                  sources = [m.group("src") for m in matches]
                  remainder = import_pattern.sub("", text)

                  # If the imported identifier is actually used, move that caller
                  # to the current machine-card router. If it was only a dead import,
                  # simply remove it.
                  uses_identifier = bool(
                      re.search(r'\bListingCard\b', remainder)
                  )

                  if uses_identifier:
                      source = sources[0]

                      if not source.endswith("ListingCard"):
                          raise SystemExit(
                              f"Unsupported retired ListingCard import in {path}: {source}"
                          )

                      modern_source = (
                          source[: -len("ListingCard")]
                          + "ixi-machine-card/IXIMachineCard"
                      )

                      modern_import = (
                          f'import IXIMachineCard from "{modern_source}";\n'
                      )

                      remainder = re.sub(
                          r'\bListingCard\b',
                          'IXIMachineCard',
                          remainder
                      )

                      text = modern_import + remainder
                  else:
                      text = remainder

                  path.write_text(text)
                  changed.append(str(path))

          print("MIGRATED FILES:")
          for path in changed:
              print(" -", path)

          # Hard gate: there must be no exact retired ListingCard default imports.
          violations = []
          for root in roots:
              if not root.exists():
                  continue

              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix not in extensions:
                      continue

                  if import_pattern.search(path.read_text()):
                      violations.append(str(path))

          if violations:
              raise SystemExit(
                  "RETIRED LISTINGCARD IMPORTS REMAIN: "
                  + ", ".join(violations)
              )

          print("RETIRED LISTINGCARD IMPORTS: 0")
          PY

      - name: Confirm retired component files are gone
        shell: bash
        run: |
          test ! -e components/ListingCard.js
          test ! -e components/ListingCard-1.js
          echo "RETIRED LISTINGCARD FILES: 0"

      - name: Remove temporary cleanup workflow
        shell: bash
        run: rm -f .github/workflows/cleanup-legacy-listingcard.yml

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No cleanup changes were required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Eliminate remaining legacy ListingCard callers"
          git push origin HEAD:main
