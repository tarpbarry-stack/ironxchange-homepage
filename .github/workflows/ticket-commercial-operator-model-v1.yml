name: Build commercial Ticket operator workflow

on:
  push:
    branches:
      - ticket/commercial-aws-completion-v1
    paths:
      - .github/workflows/ticket-commercial-operator-model-v1.yml

permissions:
  contents: write

jobs:
  build-ticket-operator-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ticket/commercial-aws-completion-v1
          fetch-depth: 0

      - name: Implement operator workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"{label} marker not found")
              return text.replace(old, new, 1)

          # ---------------------------------------------------------
          # CLIENT: queue, direct assignment, ratings
          # ---------------------------------------------------------
          p = Path('lib/ixi-tickets/ixiTicketClient.js')
          s = p.read_text()

          old = '''export async function setRemoteTicketReady(ticket) {
  const remote = await ensureRemoteDraft(ticket);
  if (!remote?.ticketId) throw new Error("AWS did not return the synchronized Ticket.");
  if (remote.status !== "draft") return remote;

  return extractTicket(await updateRemoteTicket(
    remote.ticketId,
    { status: "ready-for-chat" },
    remote.revision
  ));
}

export async function submitTicketCloseout'''
          new = '''export async function setRemoteTicketReady(ticket) {
  const remote = await ensureRemoteDraft(ticket);
  if (!remote?.ticketId) throw new Error("AWS did not return the synchronized Ticket.");
  if (remote.status !== "draft") return remote;

  const queuedAt = new Date().toISOString();
  return extractTicket(await updateRemoteTicket(
    remote.ticketId,
    {
      status: "ready-for-chat",
      metadata: {
        ...(remote.metadata || {}),
        execution: {
          ...(remote.metadata?.execution || {}),
          queuedAt
        }
      }
    },
    remote.revision
  ));
}

export async function startRemoteTicket(ticket, options = {}) {
  if (!ticket?.ticketId) throw new Error("Ticket ID is required to start work.");

  let remote = ticket;
  if (remote.status === "draft" || !Number.isInteger(remote.revision)) {
    remote = await setRemoteTicketReady(remote);
  }

  if (!["ready-for-chat", "reopened"].includes(remote.status)) return remote;

  const startedAt = new Date().toISOString();
  const assignedTo = clean(options.assignedTo) || "chat";
  const source = clean(options.source) || "manual";

  return extractTicket(await updateRemoteTicket(
    remote.ticketId,
    {
      status: "working",
      metadata: {
        ...(remote.metadata || {}),
        execution: {
          ...(remote.metadata?.execution || {}),
          assignedTo,
          claimedAt: remote.metadata?.execution?.claimedAt || startedAt,
          startedAt,
          source
        }
      }
    },
    remote.revision
  ));
}

export async function rateRemoteTicket(ticket, review = {}) {
  if (!ticket?.ticketId) throw new Error("Ticket ID is required for rating.");
  if (!Number.isInteger(ticket.revision) || ticket.revision < 1) {
    throw new Error("A synchronized Ticket revision is required for rating.");
  }

  const score = Number(review.score);
  if (!Number.isInteger(score) || score < 1 || score > 5) {
    throw new Error("Ticket rating must be from 1 to 5.");
  }

  return extractTicket(await updateRemoteTicket(
    ticket.ticketId,
    {
      metadata: {
        ...(ticket.metadata || {}),
        userReview: {
          score,
          note: clean(review.note),
          ratedAt: new Date().toISOString()
        }
      }
    },
    ticket.revision
  ));
}

