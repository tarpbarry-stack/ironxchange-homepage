name: TRANSACT Freight Build

on:
  pull_request:
    paths:
      - 'components/ixi-aos/transact/**'
      - 'lib/freight/**'
      - 'lib/mos/**'
      - 'package.json'

jobs:
  next-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SHARETRIBE_CLIENT_ID: 'ci-build-client'
