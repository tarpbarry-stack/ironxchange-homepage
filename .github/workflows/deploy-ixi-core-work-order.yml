name: Deploy IX-Core Work Order

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Immutable IX-Core Work Order commit SHA
        required: true

permissions:
  contents: read

concurrency:
  group: ixi-core-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
      IXI_CORE_SHA: ${{ inputs.commit_sha }}

    steps:
      - name: Validate immutable release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IXI_CORE_SHA" =~ ^[0-9a-f]{40}$ ]]
          resolved_sha="$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/tarpbarry-stack/ixi-core/commits/$IXI_CORE_SHA" | jq -r '.sha')"
          test "$resolved_sha" = "$IXI_CORE_SHA"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy guarded Work Order release
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          remote_script="$(cat <<'REMOTE_SCRIPT'
          set -eu
          APP=/var/www/ix-core
          RELEASE_SHA=__IXI_CORE_SHA__
          STAGE=/tmp/ixi-core-work-order-__IXI_CORE_SHA__
          ARCHIVE=/tmp/ixi-core-work-order-__IXI_CORE_SHA__.tgz
          BACKUP=/var/backups/ixi-core-releases/work-order-pre-__IXI_CORE_SHA__.tgz
          TARGET_FACTORY=financial/IXIFinancialWorkOrderFactory.js
          TARGET_INDEX=index.js
          TARGET_GATEWAY=identity/IXIInternalFinancialRequest.js
          PATCHED_INDEX="$STAGE/index.live-patched.js"
          GATEWAY_EXISTED=0
          SUCCESS=0

          run_pm2() {
            if [ "$PM2_USER" = root ]; then pm2 "$@"; else sudo -u ubuntu -H pm2 "$@"; fi
          }

          rollback() {
            if [ "$SUCCESS" -eq 0 ] && [ -f "$BACKUP" ]; then
              echo 'Deployment failed; restoring the previous Work Order release.' >&2
              cd "$APP"
              tar -xzf "$BACKUP"
              if [ "$GATEWAY_EXISTED" -eq 0 ]; then rm -f "$TARGET_GATEWAY"; fi
              run_pm2 reload IX-Core --update-env || run_pm2 restart IX-Core --update-env || true
            fi
          }
          trap rollback EXIT

          test -d "$APP"
          test -f "$APP/index.js"
          if pm2 describe IX-Core >/dev/null 2>&1; then
            PM2_USER=root
          elif sudo -u ubuntu -H pm2 describe IX-Core >/dev/null 2>&1; then
            PM2_USER=ubuntu
          else
            echo 'PM2 process IX-Core was not found.' >&2
            exit 1
          fi

          cd "$APP"
          printf '%s  %s\n' \
            '252b85a4515f6131fbf786890e2f385c663749865631b341739256e499049c05' \
            "$TARGET_FACTORY" | sha256sum -c -
          printf '%s  %s\n' \
            '5bf4a592205173f7c59cb63fb8159261c7ff9319fa3929492eb69e724b20dc26' \
            "$TARGET_INDEX" | sha256sum -c -

          mkdir -p /var/backups/ixi-core-releases
          if [ -f "$TARGET_GATEWAY" ]; then
            GATEWAY_EXISTED=1
            tar -czf "$BACKUP" "$TARGET_FACTORY" "$TARGET_INDEX" "$TARGET_GATEWAY"
          else
            tar -czf "$BACKUP" "$TARGET_FACTORY" "$TARGET_INDEX"
          fi
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          curl -fsSL "https://github.com/tarpbarry-stack/ixi-core/archive/$RELEASE_SHA.tar.gz" -o "$ARCHIVE"
          tar -xzf "$ARCHIVE" --strip-components=1 -C "$STAGE"

          cd "$STAGE"
          npm ci --ignore-scripts
          npm test
          node --check "$TARGET_FACTORY"
          node --check "$TARGET_INDEX"
          node --check "$TARGET_GATEWAY"
          cp "$APP/$TARGET_INDEX" "$PATCHED_INDEX"
          node - "$PATCHED_INDEX" <<'PATCH_INDEX'
          const fs = require('fs');
          const file = process.argv[2];
          let source = fs.readFileSync(file, 'utf8');
          const requireAnchor = `const {\n  ixiOptionalMosAuthorityRequest\n} = require(\n  "./authority/IXIAuthorityMosRequest"\n);`;
          const internalRequire = `const {\n  ixiInternalFinancialRequest\n} = require(\n  "./identity/IXIInternalFinancialRequest"\n);\n\n`;
          const mountAnchor = `app.use(\n  "/financial",\n  ixiAuthenticatedFinancialRequest,\n  financialRoutes\n);`;
          const patchedMount = `app.use(\n  "/financial",\n  ixiInternalFinancialRequest,\n  ixiAuthenticatedFinancialRequest,\n  financialRoutes\n);`;
          if (source.includes('ixiInternalFinancialRequest')) throw new Error('Financial internal middleware already mounted');
          if (!source.includes(requireAnchor) || !source.includes(mountAnchor)) throw new Error('Live index patch anchors do not match');
          source = source.replace(requireAnchor, internalRequire + requireAnchor).replace(mountAnchor, patchedMount);
          fs.writeFileSync(file, source);
          PATCH_INDEX
          node --check "$PATCHED_INDEX"
          node - <<'NODE'
          const { createWorkOrderDocument } = require('./financial/IXIFinancialWorkOrderFactory');
          const document = createWorkOrderDocument({
            financialDocumentId: 'ifd_deploy_probe',
            machinePassportId: 'passport:machine:deploy-probe',
            workOrder: { identity: {}, work: { status: 'in-progress' } }
          });
          if (document.documentNumber !== 'WO-OY_PROBE' || document.workOrder.identity.workOrderId !== 'ifd_deploy_probe') {
            throw new Error('Work Order factory deploy probe failed.');
          }
          NODE

          install -D -m 0644 "$STAGE/$TARGET_FACTORY" "$APP/$TARGET_FACTORY"
          install -D -m 0644 "$PATCHED_INDEX" "$APP/$TARGET_INDEX"
          install -D -m 0644 "$STAGE/$TARGET_GATEWAY" "$APP/$TARGET_GATEWAY"
          run_pm2 reload IX-Core --update-env

          attempt=0
          until curl -fsS http://127.0.0.1:4100/health >/dev/null; do
            attempt=$((attempt + 1))
            [ "$attempt" -lt 15 ] || exit 1
            sleep 2
          done

          route_status="$(curl -sS -o "$STAGE/work-order-route.json" -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -d '{"documentType":"work-order","input":{}}' \
            http://127.0.0.1:4100/financial/commands/create)"
          case "$route_status" in 401|403) ;; *) cat "$STAGE/work-order-route.json" >&2; exit 1 ;; esac

          SUCCESS=1
          trap - EXIT
          rm -rf "$STAGE"
          rm -f "$ARCHIVE"
          printf 'IX-Core Work Order %s deployed; health=200; protected-route=%s\n' "$RELEASE_SHA" "$route_status"
          REMOTE_SCRIPT
          )"

          remote_script="${remote_script//__IXI_CORE_SHA__/$IXI_CORE_SHA}"
          parameters="$(jq -cn --arg command "$remote_script" '{commands:[$command]}')"
          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$AWS_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy IX-Core Work Order $IXI_CORE_SHA" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$AWS_INSTANCE_ID" || true
          invocation="$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$AWS_INSTANCE_ID")"
          printf '%s' "$invocation" | jq -r '.StandardOutputContent'
          printf '%s' "$invocation" | jq -r '.StandardErrorContent' >&2
          test "$(printf '%s' "$invocation" | jq -r '.Status')" = Success

      - name: Record release
        shell: bash
        run: |
          {
            echo '## IX-Core Work Order production release'
            echo "- Commit: \`$IXI_CORE_SHA\`"
            echo "- SSM command: \`${{ steps.deploy.outputs.command_id }}\`"
            echo '- Health: passed'
            echo '- Protected Work Order route: passed'
          } >> "$GITHUB_STEP_SUMMARY"
