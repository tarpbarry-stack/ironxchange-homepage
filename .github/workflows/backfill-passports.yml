name: Backfill Machine Passports

on:
  workflow_dispatch:

jobs:
  backfill-passports:
    name: Backfill Passports
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Passport backfill
        env:
          SHARETRIBE_CLIENT_ID: ${{ secrets.SHARETRIBE_CLIENT_ID }}
          SHARETRIBE_CLIENT_SECRET: ${{ secrets.SHARETRIBE_CLIENT_SECRET }}
          IX_CORE_BASE_URL: ${{ secrets.IX_CORE_BASE_URL }}
        run: node scripts/backfillPassports.mjs
