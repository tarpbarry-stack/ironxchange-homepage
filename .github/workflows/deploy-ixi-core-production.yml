name: Deploy IX-Core production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Immutable IX-Core commit SHA
        required: true
        default: c5d41fccae5f7966be8aa7178e74beb0120ab687
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-ixi-core-production.yml

permissions:
  contents: read

concurrency:
  group: ixi-core-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
      IXI_CORE_SHA: ${{ inputs.commit_sha || 'c5d41fccae5f7966be8aa7178e74beb0120ab687' }}

    steps:
      - name: Validate immutable release
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$IXI_CORE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "IXI_CORE_SHA must be a full Git commit SHA" >&2
            exit 1
          fi

          release_url="https://api.github.com/repos/tarpbarry-stack/ixi-core/commits/$IXI_CORE_SHA"
          resolved_sha="$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$release_url" | jq -r '.sha')"

          test "$resolved_sha" = "$IXI_CORE_SHA"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy guarded IX-Core release
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          remote_script="$(cat <<'REMOTE_SCRIPT'
          set -eu

          APP=/var/www/ix-core
          RELEASE_SHA=__IXI_CORE_SHA__
          STAGE=/tmp/ixi-core-release-__IXI_CORE_SHA__
          ARCHIVE=/tmp/ixi-core-release-__IXI_CORE_SHA__.tgz
          BACKUP_ROOT=/var/backups/ixi-core-releases
          BACKUP=$BACKUP_ROOT/pre-__IXI_CORE_SHA__.tgz
          SUCCESS=0

          changed_files='financial/IXIFinancialCommandEngine.js financial/IXIFinancialCommandRoutes.js financial/IXIFinancialGLProjectionEngine.js financial/IXIFinancialPermissionEngine.js financial/IXIFinancialProviderService.js mos/objects/objectService.js mos/routes/mosRouter.js package.json'
          added_files='financial/IXIFinancialGLProjectionEngine.test.js financial/IXIFinancialJournalPostingService.js financial/IXIFinancialJournalPostingService.test.js financial/IXIFinancialPermissionEngine.test.js'

          rollback() {
            if [ "$SUCCESS" -eq 1 ]; then
              return
            fi

            echo 'Deployment failed; restoring previous IX-Core source.' >&2
            if [ -f "$BACKUP" ]; then
              cd "$APP"
              rm -f $added_files
              tar -xzf "$BACKUP"
              run_pm2 reload IX-Core --update-env || run_pm2 restart IX-Core --update-env || true
            fi
          }

          trap rollback EXIT

          test -d "$APP"
          test -f "$APP/index.js"

          if pm2 describe IX-Core >/dev/null 2>&1; then
            PM2_USER=root
          elif sudo -u ubuntu -H pm2 describe IX-Core >/dev/null 2>&1; then
            PM2_USER=ubuntu
          else
            echo 'PM2 process IX-Core was not found.' >&2
            exit 1
          fi

          run_pm2() {
            if [ "$PM2_USER" = root ]; then
              pm2 "$@"
            else
              sudo -u ubuntu -H pm2 "$@"
            fi
          }

          cd "$APP"
          cat > /tmp/ixi-core-live-baseline.sha256 <<'CHECKSUMS'
          597a3c5c917b227cb347eba9409bd116dce03bcf438c92177cf7e3e1ab770325  financial/IXIFinancialCommandEngine.js
          422e74a38c208787a04555616d38a0dbfc231aaa6afd563367d9dd913c88016e  financial/IXIFinancialCommandRoutes.js
          923d112c8e99007644a36c0a4fd8f8ada6010db68cf319d7fa421360a958eec1  financial/IXIFinancialGLProjectionEngine.js
          dc02cb4c1e210e4ea5dfb6805d89ce061b87a4aca4ad7b3b3dd121d39f53e552  financial/IXIFinancialPermissionEngine.js
          1ab56000c49b78dcd69c5cb5ac88e003c043f0a2515a16bbf2d80ad6545dc81b  financial/IXIFinancialProviderService.js
          9ecb7fe8524a45550a8922f79ae42360a3522d69a163b9a81aa89c71e71632c4  mos/objects/objectService.js
          bbdb5427430e459e5acfb283d67b446c2c820ed064c3c203089cd27d9f975303  mos/routes/mosRouter.js
          45b10c3f69222dbcdce4ad659b523700d1d28be31afdf6c86db699fb61b8d0c3  package.json
          CHECKSUMS
          sha256sum -c /tmp/ixi-core-live-baseline.sha256

          rm -rf "$STAGE"
          mkdir -p "$STAGE" "$BACKUP_ROOT"
          curl -fsSL \
            "https://github.com/tarpbarry-stack/ixi-core/archive/$RELEASE_SHA.tar.gz" \
            -o "$ARCHIVE"
          tar -xzf "$ARCHIVE" --strip-components=1 -C "$STAGE"

          cd "$STAGE"
          npm ci --ignore-scripts
          npm test
          node --check financial/IXIFinancialCommandEngine.js
          node --check financial/IXIFinancialCommandRoutes.js
          node --check financial/IXIFinancialJournalPostingService.js
          node --check mos/objects/objectService.js
          node --check mos/routes/mosRouter.js
          node --test mos/tests/objectMutationContract.test.js
          node -e "require('./financial/IXIFinancialCommandEngine'); require('./financial/IXIFinancialCommandRoutes')"

          cd "$APP"
          tar -czf "$BACKUP" $changed_files

          for file in $changed_files $added_files; do
            install -D -m 0644 "$STAGE/$file" "$APP/$file"
          done

          run_pm2 reload IX-Core --update-env

          attempt=0
          until curl -fsS http://127.0.0.1:4100/health >/dev/null; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 15 ]; then
              echo 'IX-Core failed its post-reload health check.' >&2
              exit 1
            fi
            sleep 2
          done

          route_status="$(curl -sS -o "$STAGE/post-route.json" -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -d '{"expectedRevision":1}' \
            http://127.0.0.1:4100/financial/commands/desktop/journals/deploy-probe/post)"

          case "$route_status" in
            401|403) ;;
            *)
              echo "Protected journal-post route returned unexpected HTTP $route_status" >&2
              cat "$STAGE/post-route.json" >&2 || true
              exit 1
              ;;
          esac

          SUCCESS=1
          trap - EXIT
          rm -rf "$STAGE" "$ARCHIVE"
          printf 'IX-Core %s deployed; health=200; journal-post-route=%s\n' \
            "$RELEASE_SHA" "$route_status"
          REMOTE_SCRIPT
          )"

          remote_script="${remote_script//__IXI_CORE_SHA__/$IXI_CORE_SHA}"
          parameters="$(jq -cn --arg command "$remote_script" '{commands:[$command]}')"
          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$AWS_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy immutable IX-Core $IXI_CORE_SHA" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"

          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

          if ! aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$AWS_INSTANCE_ID"; then
            true
          fi

          invocation="$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$AWS_INSTANCE_ID")"

          printf '%s' "$invocation" | jq -r '.StandardOutputContent'
          printf '%s' "$invocation" | jq -r '.StandardErrorContent' >&2

          status="$(printf '%s' "$invocation" | jq -r '.Status')"
          test "$status" = "Success"

      - name: Record release
        shell: bash
        run: |
          {
            echo '## IX-Core production release'
            echo "- Commit: \`$IXI_CORE_SHA\`"
            echo "- Instance: \`$AWS_INSTANCE_ID\`"
            echo "- SSM command: \`${{ steps.deploy.outputs.command_id }}\`"
            echo '- Health: passed'
            echo '- Protected journal-post route: passed'
          } >> "$GITHUB_STEP_SUMMARY"
