name: IXI Mobile Card Face Certification

on:
  push:
    branches:
      - mobile/commercial-aos-v1-card-faces
    paths:
      - "pages/mobile-foundation.js"
      - "tests/ixi-mobile-foundation-contract.test.mjs"
      - "tests/ixi-mobile-card-faces-contract.test.mjs"
      - ".github/workflows/ixi-mobile-card-faces.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ixi-mobile-card-faces-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SHARETRIBE_CLIENT_ID: ixi-mobile-ci-placeholder

    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install repository dependencies
        run: npm install --no-audit --no-fund

      - name: Re-run certified foundation contract
        run: node --test tests/ixi-mobile-foundation-contract.test.mjs

      - name: Run card face contract
        run: node --test tests/ixi-mobile-card-faces-contract.test.mjs

      - name: Build production application
        run: npm run build
