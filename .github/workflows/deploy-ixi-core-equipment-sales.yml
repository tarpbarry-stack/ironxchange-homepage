name: Deploy IX-Core Equipment Sales

"on":
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Immutable IX-Core commit SHA
        required: true
        default: 037bd6a715a98c37f2be10b4f7e00c7efd8530bf
  push:
    branches: [main]
    paths: [".github/workflows/deploy-ixi-core-equipment-sales.yml"]

permissions:
  contents: read

concurrency:
  group: ixi-core-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
      IXI_CORE_SHA: ${{ inputs.commit_sha || '037bd6a715a98c37f2be10b4f7e00c7efd8530bf' }}
    steps:
      - name: Validate immutable release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IXI_CORE_SHA" =~ ^[0-9a-f]{40}$ ]]
          resolved_sha="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/tarpbarry-stack/ixi-core/commits/$IXI_CORE_SHA" | jq -r '.sha')"
          test "$resolved_sha" = "$IXI_CORE_SHA"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy guarded Equipment Sales release
        shell: bash
        run: |
          set -euo pipefail
          remote_script="$(cat <<'REMOTE_SCRIPT'
          set -eu
          APP=/var/www/ix-core
          RELEASE_SHA=__IXI_CORE_SHA__
          STAGE=/tmp/ixi-core-equipment-sales-__IXI_CORE_SHA__
          ARCHIVE=/tmp/ixi-core-equipment-sales-__IXI_CORE_SHA__.tgz
          BACKUP=/var/backups/ixi-core-releases/equipment-sales-pre-__IXI_CORE_SHA__.tgz
          BASELINE_EXISTING='financial/IXIFinancialCommandEngine.js financial/IXIFinancialCommandRoutes.js financial/IXIFinancialDocumentFactoryRegistry.js financial/IXIFinancialRoutes.js financial/IXIFinancialValidationBridge.js'
          NEW='financial/IXIFinancialSalesOrderFactory.js financial/IXIFinancialSalesCloseoutControl.js financial/IXIFinancialAttachmentService.js sales/IXISalesSigningRoutes.js sales/IXISalesSigningService.js sales/IXISalesSigningToken.js'
          CHANGED="$BASELINE_EXISTING $NEW"
          SUCCESS=0
          ROLLBACK_ARMED=0
          CREATED=''

          run_pm2() { if [ "$PM2_USER" = root ]; then pm2 "$@"; else sudo -u ubuntu -H pm2 "$@"; fi; }
          rollback() {
            if [ "$SUCCESS" -eq 0 ] && [ "$ROLLBACK_ARMED" -eq 1 ] && [ -f "$BACKUP" ]; then
              echo 'Deployment failed; restoring previous IX-Core source.' >&2
              cd "$APP"
              tar -xzf "$BACKUP"
              for file in $CREATED; do rm -f "$APP/$file"; done
              run_pm2 reload IX-Core --update-env || run_pm2 restart IX-Core --update-env || true
            fi
          }
          trap rollback EXIT

          test -d "$APP"
          if pm2 describe IX-Core >/dev/null 2>&1; then PM2_USER=root;
          elif sudo -u ubuntu -H pm2 describe IX-Core >/dev/null 2>&1; then PM2_USER=ubuntu;
          else echo 'PM2 process IX-Core was not found.' >&2; exit 1; fi

          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          curl -fsSL "https://github.com/tarpbarry-stack/ixi-core/archive/$RELEASE_SHA.tar.gz" -o "$ARCHIVE"
          tar -xzf "$ARCHIVE" --strip-components=1 -C "$STAGE"

          cd "$APP"
          ALREADY_CURRENT=1
          for file in $CHANGED; do cmp -s "$APP/$file" "$STAGE/$file" || ALREADY_CURRENT=0; done
          grep -q 'sales/IXISalesSigningRoutes' "$APP/index.js" || ALREADY_CURRENT=0
          grep -q '"/sales-signing"' "$APP/index.js" || ALREADY_CURRENT=0
          if [ "$ALREADY_CURRENT" -ne 1 ]; then
            for file in $CHANGED; do test -f "$STAGE/$file"; done
            for file in $BASELINE_EXISTING; do test -f "$APP/$file"; done
            grep -q 'const financialRoutes = require("./financial/IXIFinancialRoutes");' "$APP/index.js"
            grep -q 'app.use(' "$APP/index.js"
            grep -q '"/financial"' "$APP/index.js"
          fi

          cd "$STAGE"
          npm ci --ignore-scripts
          AUDIT_OK=0
          for audit_attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=low --fetch-timeout=60000 --fetch-retries=2; then AUDIT_OK=1; break; fi
            sleep $((audit_attempt * 5))
          done
          test "$AUDIT_OK" -eq 1
          npm test
          for file in $CHANGED; do node --check "$file"; done
          IXI_MOS_INTERNAL_SECRET='deployment-probe-master-secret-at-least-thirty-two-characters' node - <<'NODE'
          const {createFinancialDocumentByType}=require('./financial/IXIFinancialDocumentFactoryRegistry');
          const {validateFinancialDocument}=require('./financial/IXIFinancialValidationBridge');
          const {createSalesSigningToken,verifySalesSigningToken}=require('./sales/IXISalesSigningToken');
          const refs=[{role:'asset',passportId:'pass_asset_probe'},{role:'entity',passportId:'pass_entity_probe'}];
          const doc=createFinancialDocumentByType({documentType:'sales-order',input:{financialDocumentId:'ifd_so_probe',documentNumber:'SO-PROBE',references:refs,salesOrder:{schema:'ixi-equipment-sales-order-v1',identity:{revision:1},context:{primaryPassportId:'pass_asset_probe',entityPassportId:'pass_entity_probe',actorPassportId:'pass_actor_probe'},customer:{name:'Probe Buyer',email:'probe@example.com'},asset:{label:'Probe Machine',serialNumber:'SN-PROBE'},commercial:{currency:'USD',paymentTerms:'Wire before release'},totals:{subtotal:100,tax:0,freight:0,fees:0,tradeAllowance:0,deposit:0,total:100,balanceDue:100},status:'draft'}}});
          if(!validateFinancialDocument(doc).ok||doc.documentType!=='sales-order'||doc.accountingTreatment.economicEvent!==false) throw new Error('Sales Order control probe failed.');
          const token=createSalesSigningToken({salesOrderId:'ifd_so_probe',revision:1,tokenVersion:1,expiresAt:'2030-01-01T00:00:00.000Z',nonce:'probe'});
          if(verifySalesSigningToken(token,{now:Date.parse('2029-01-01')}).salesOrderId!=='ifd_so_probe') throw new Error('Sales signing probe failed.');
          NODE

          cd "$APP"
          if [ "$ALREADY_CURRENT" -ne 1 ]; then
            mkdir -p /var/backups/ixi-core-releases
            BACKUP_FILES='index.js'
            for file in $CHANGED; do
              if [ -e "$APP/$file" ]; then BACKUP_FILES="$BACKUP_FILES $file"; else CREATED="$CREATED $file"; fi
            done
            tar -czf "$BACKUP" $BACKUP_FILES
            ROLLBACK_ARMED=1
            for file in $CHANGED; do install -D -m 0644 "$STAGE/$file" "$APP/$file"; done
          node - "$APP/index.js" <<'NODE'
          const fs=require('fs');
          const path=process.argv[2];
          let source=fs.readFileSync(path,'utf8');
          if(!source.includes('sales/IXISalesSigningRoutes')) {
            const anchor='const financialRoutes = require("./financial/IXIFinancialRoutes");';
            if(source.split(anchor).length!==2) throw new Error('IX-Core index financial import anchor is ambiguous.');
            source=source.replace(anchor,`${anchor}\nconst salesSigningRoutes = require("./sales/IXISalesSigningRoutes");`);
          }
          if(!source.includes('"/sales-signing"')) {
            const anchor='app.use(\n  "/financial",';
            if(source.split(anchor).length!==2) throw new Error('IX-Core index financial route anchor is ambiguous.');
            source=source.replace(anchor,'app.use(\n  "/sales-signing",\n  salesSigningRoutes\n);\n\n'+anchor);
          }
          const next=`${path}.equipment-sales-next`;
          fs.writeFileSync(next,source,{mode:0o644});
          fs.renameSync(next,path);
          NODE
            run_pm2 reload IX-Core --update-env
          fi

          attempt=0
          until curl -fsS http://127.0.0.1:4100/health >/dev/null; do attempt=$((attempt + 1)); [ "$attempt" -lt 15 ] || exit 1; sleep 2; done
          signing_status="$(curl -sS -o "$STAGE/signing-route.json" -w '%{http_code}' http://127.0.0.1:4100/sales-signing/not.valid)"
          invitation_status="$(curl -sS -o "$STAGE/invitation-route.json" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:4100/financial/sales-orders/ifd_probe/signing-invitations)"
          case "$signing_status" in 400) ;; *) cat "$STAGE/signing-route.json" >&2; exit 1 ;; esac
          case "$invitation_status" in 401|403) ;; *) cat "$STAGE/invitation-route.json" >&2; exit 1 ;; esac

          SUCCESS=1
          ROLLBACK_ARMED=0
          trap - EXIT
          rm -rf "$STAGE"
          rm -f "$ARCHIVE"
          printf 'IX-Core Equipment Sales %s deployed; health=200; signing=%s; invitation-auth=%s\n' "$RELEASE_SHA" "$signing_status" "$invitation_status"
          REMOTE_SCRIPT
          )"
          remote_script="${remote_script//__IXI_CORE_SHA__/$IXI_CORE_SHA}"
          parameters="$(jq -cn --arg command "$remote_script" '{commands:[$command]}')"
          command_id="$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$AWS_INSTANCE_ID" --document-name AWS-RunShellScript --comment "Deploy IX-Core Equipment Sales $IXI_CORE_SHA" --parameters "$parameters" --query 'Command.CommandId' --output text)"
          invocation=''
          status='Pending'
          for attempt in $(seq 1 240); do
            invocation="$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID" 2>/dev/null || true)"
            status="$(printf '%s' "$invocation" | jq -r '.Status // "Pending"')"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break ;; esac
            sleep 5
          done
          printf '%s' "$invocation" | jq -r '.StandardOutputContent'
          printf '%s' "$invocation" | jq -r '.StandardErrorContent' >&2
          test "$status" = Success

      - name: Record Equipment Sales release
        shell: bash
        run: |
          {
            echo '## IX-Core Equipment Sales release'
            printf -- '- Commit: `%s`\n' "$IXI_CORE_SHA"
            echo '- Financial, Sales, evidence, and closeout control tests: passed'
            echo '- Production dependency audit: passed'
            echo '- AWS health, public signing, and authenticated invitation route probes: passed'
          } >> "$GITHUB_STEP_SUMMARY"
